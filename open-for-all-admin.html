<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open for All Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><style>
:root{--pink:#cc2d88;--dark:#2d2730;--soft:#fff8fb;--line:#edd8e5}*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff8fb,#f6effa);margin:0;color:var(--dark)}.w{max-width:1180px;margin:auto;padding:28px 18px}.hero{background:linear-gradient(135deg,#d92f8d,#a843bd);color:#fff;border-radius:26px;padding:26px 30px;box-shadow:0 15px 40px #b62b7b33}.hero h1{margin:0 0 6px}.hero p{margin:0;opacity:.9}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:20px}.stat{padding:18px}.stat .num{font-size:28px;font-weight:900;color:var(--pink);margin-top:7px}.card{padding:20px;margin:15px 0}.card h2{margin:0 0 15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:13px}.f input,.f textarea,.f select{width:100%;padding:12px;border:1px solid #e2cbd8;border-radius:11px;font:inherit;background:#fff}.btn{background:var(--pink);color:#fff;border:0;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer}.btn.alt{background:#fff;color:var(--pink);border:1px solid var(--pink)}.row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:14px 0;border-bottom:1px solid #f0e6ec}.empty{padding:22px;text-align:center;color:#8a7b84;background:#fff8fb;border-radius:12px}.preview{width:110px;height:110px;object-fit:contain;border:1px dashed #e0b8cf;border-radius:12px;padding:5px;margin-top:8px}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:12px;color:#8a7b84}.tag{display:inline-block;background:#fff0f7;color:var(--pink);padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.row{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="w">
<div class="hero"><h1>🌐 Open for All Admin</h1><p>Completely separate from Group Buy — Products • Payments • Waybills • Totals</p></div>
<div id="stats" class="stats"></div>
<div class="card"><h2>➕ Add Product</h2><div class="grid"><label class="f">Product Name<input id="pn" placeholder="e.g. Tirzepatide 15mg"></label><label class="f">Amount<input id="pa" type="number" placeholder="0"></label><label class="f">MOQ<input id="pm" type="number" value="1"></label><label class="f">Product Photo<input id="pi" type="file" accept="image/png,image/jpeg,image/webp"></label></div><img id="pprev" class="preview" style="display:none"><br><button id="addProductBtn" type="button" class="btn">ADD PRODUCT</button><div id="saveStatus" class="small" style="margin-top:10px"></div><div id="plist"></div></div>
<div class="card"><h2>💳 Payments / Approval</h2><div id="payments"></div></div>
<div class="card"><h2>🚚 Consolidated Waybills</h2><p class="small">Same-email orders are consolidated here for MOQ/Open for All only.</p><div id="ways"></div></div>
<div class="card"><h2>📱 Separate QR & Shipping</h2><div class="grid"><label class="f">Payment QR Image<input id="qrfile" type="file" accept="image/png,image/jpeg,image/webp"></label><label class="f">Payment Name<input id="pay" placeholder="Account / payment name"></label><label class="f">Luzon Shipping<input id="lu" type="number"></label><label class="f">Visayas Shipping<input id="vi" type="number"></label><label class="f">Mindanao Shipping<input id="mi" type="number"></label><label class="f">Lalamove Shipping<input id="la" type="number" placeholder="0"></label></div><img id="qrprev" class="preview" style="display:none"><label class="f" style="margin-top:12px">Instructions<textarea id="ins" placeholder="Payment instructions"></textarea></label><br><button id="saveSettingsBtn" type="button" class="btn">SAVE SETTINGS</button></div>
</div><script>
let s,settings={};const ofaPeso=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2});
const empty=t=>'<div class="empty">'+t+'</div>';
async function boot(){s=initSupabase();await requireAdmin();const statusEl=document.getElementById('saveStatus');if(statusEl)statusEl.textContent='Ready to save to MOQ database.';await load()}
async function load(){const results=await Promise.all([s.from('ofa_orders').select('*').order('created_at',{ascending:false}),s.from('ofa_products').select('*').order('created_at',{ascending:false}),s.from('ofa_waybills').select('*').order('created_at',{ascending:false}),s.from('ofa_settings').select('*').eq('id',true).single(),s.from('ofa_order_items').select('*')]);const o=results[0],p=results[1],wayRes=results[2],st=results[3],it=results[4];if(o.error||p.error||wayRes.error)console.error(o.error||p.error||wayRes.error);let O=o.data||[],sales=O.filter(x=>x.payment_status==='PAID').reduce((a,x)=>a+(+x.total||0),0),pending=O.filter(x=>x.payment_status==='SUBMITTED').length,paid=O.filter(x=>x.payment_status==='PAID').length;settings=st.data||{};stats.innerHTML='<div class="stat"><div class="small">TOTAL ORDERS</div><div class="num">'+O.length+'</div></div><div class="stat"><div class="small">PAID SALES</div><div class="num">'+ofaPeso(sales)+'</div></div><div class="stat"><div class="small">PENDING PAYMENTS</div><div class="num">'+pending+'</div></div><div class="stat"><div class="small">PAID ORDERS</div><div class="num">'+paid+'</div></div>';
plist.innerHTML=(p.data||[]).map(x=>`<div class="row"><span>${x.image_url?'<img class="preview" style="width:60px;height:60px;vertical-align:middle;margin-right:10px" src="'+x.image_url+'">':''}<b>${x.name}</b><br><span class="small">${ofaPeso(x.amount)} • MOQ ${x.moq} • <span class="tag">${x.status}</span></span></span><div class="actions"><button class="btn alt" onclick="toggle('${x.id}','${x.status}')">${x.status==='AVAILABLE'?'SOLD OUT':'MAKE AVAILABLE'}</button><button class="btn alt" style="color:#b42318;border-color:#b42318" onclick="deleteProduct('${x.id}')">DELETE</button></div></div>`).join('')||empty('No Open for All products yet.');
payments.innerHTML=O.map(x=>`<div class="row"><span><b>${x.order_id}</b><br>${x.customer_name} • ${x.email}<br><b>${ofaPeso(x.total)}</b> • <span class="tag">${x.payment_status}</span><br>${x.payment_proof_url?'<a target="_blank" href="'+x.payment_proof_url+'">View payment proof</a>':'No payment proof'}</span><div class="actions"><button class="btn" onclick="stat('${x.order_id}','PAID')">APPROVE</button><button class="btn alt" onclick="stat('${x.order_id}','REJECTED')">REJECT</button><button class="btn alt" style="color:#b42318;border-color:#b42318" onclick="deleteOrder('${x.order_id}')">DELETE ORDER</button></div></div>`).join('')||empty('No payments yet.');
const waybillRows=wayRes.data||[];
const items=it.data||[];

// Build consolidated Open for All groups by email.
// This stays completely separate from the regular Group Buy system.
const groups={};
O.forEach(order=>{
  const key=(order.email||order.order_id||'unknown').trim().toLowerCase();
  if(!groups[key]) groups[key]={email:order.email||'No email',orders:[],items:[],waybills:[]};
  groups[key].orders.push(order);
});
items.forEach(item=>{
  const order=O.find(x=>x.order_id===item.order_id);
  if(!order) return;
  const key=(order.email||order.order_id||'unknown').trim().toLowerCase();
  if(groups[key]) groups[key].items.push(item);
});
waybillRows.forEach(row=>{
  const order=O.find(x=>x.order_id===row.order_id);
  if(!order) return;
  const key=(order.email||order.order_id||'unknown').trim().toLowerCase();
  if(groups[key]) groups[key].waybills.push(row);
});

ways.innerHTML=Object.values(groups).map(g=>{const first=g.orders[0],qty=g.items.reduce((a,z)=>a+(+z.qty||0),0),products={};g.items.forEach(z=>products[z.product_name]=(products[z.product_name]||0)+(+z.qty||0));const productText=Object.entries(products).map(([n,q])=>n+' × '+q).join(' • ')||'No items';return '<div class="row"><span><b>'+g.email+'</b><br>'+first.customer_name+' • '+(first.contact||'No contact')+'<br><span class="small">'+first.address+'</span><br><span class="tag">'+g.orders.length+' ORDER(S)</span> <span class="tag">'+qty+' TOTAL QTY</span><br><span class="small">'+productText+'</span></span><div class="actions"><button class="btn" onclick="printConsolidated(\''+g.email+'\')">PRINT CONSOLIDATED</button><button class="btn alt" onclick="editConsolidatedWaybill(\''+g.email+'\')">SET WAYBILL</button></div></div>';}).join('')||empty('No Open for All orders yet.');
pay.value=settings.payment_name||'';ins.value=settings.payment_instructions||'';lu.value=settings.luzon_fee??100;vi.value=settings.visayas_fee??150;mi.value=settings.mindanao_fee??180;la.value=settings.lalamove_fee??0;if(settings.payment_qr_url){qrprev.src=settings.payment_qr_url;qrprev.style.display='block'}}
async function upload(file,folder){if(!file)return null;let ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,''),path=folder+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext,r=await s.storage.from('ofa-assets').upload(path,file,{contentType:file.type,upsert:false});if(r.error)throw r.error;return s.storage.from('ofa-assets').getPublicUrl(path).data.publicUrl}
async function addP(){const pnEl=document.getElementById('pn'),paEl=document.getElementById('pa'),pmEl=document.getElementById('pm'),piEl=document.getElementById('pi'),pp=document.getElementById('pprev'),b=document.getElementById('addProductBtn'),statusEl=document.getElementById('saveStatus');statusEl.textContent='Starting save...';if(!pnEl.value.trim()||!paEl.value){statusEl.textContent='Please enter Product Name and Amount.';return alert('Please enter Product Name and Amount.');}b.disabled=true;b.textContent='SAVING...';statusEl.textContent='Saving product to database...';try{let r=await s.rpc('ofa_add_product_admin',{p_name:pnEl.value.trim(),p_amount:Number(paEl.value),p_moq:Math.max(1,Number(pmEl.value||1)),p_status:'AVAILABLE'});if(r.error)throw r.error;let saved=Array.isArray(r.data)?r.data[0]:r.data;if(!saved||!saved.id)throw new Error('Product save returned no ID');let photoWarning='';if(piEl.files[0]){try{let url=await upload(piEl.files[0],'products');if(url){let u=await s.from('ofa_products').update({image_url:url}).eq('id',saved.id);if(u.error)throw u.error}}catch(e){console.error('Photo upload failed',e);photoWarning=' Product was saved, but the photo did not upload: '+(e.message||'unknown error')}}pnEl.value=paEl.value='';pmEl.value=1;piEl.value='';pp.style.display='none';statusEl.textContent='Product saved successfully.';alert('Product saved!'+photoWarning);await load()}catch(e){console.error(e);statusEl.textContent='ERROR: '+(e.message||JSON.stringify(e));alert('Could not add product: '+(e.message||JSON.stringify(e)))}finally{b.disabled=false;b.textContent='ADD PRODUCT'}}
async function toggle(id,st){let r=await s.from('ofa_products').update({status:st==='AVAILABLE'?'SOLD_OUT':'AVAILABLE'}).eq('id',id);if(r.error)alert(r.error.message);else load()}
async function deleteProduct(id){if(!confirm('Delete this Open for All product? This is for trial only. Products already used in an order cannot be deleted.'))return;let r=await s.from('ofa_products').delete().eq('id',id);if(r.error)alert('Could not delete product: '+r.error.message);else load()}
async function deleteOrder(orderId){
  if(!confirm('DELETE Open for All order '+orderId+'? This permanently removes only this MOQ/Open for All order. Its items and waybill are automatically deleted too. Regular Group Buy is NOT touched.'))return;
  try{
    const r=await s.from('ofa_orders').delete().eq('order_id',orderId).select('order_id');
    if(r.error)throw r.error;
    if(!r.data||!r.data.length)throw new Error('Order was not deleted. Please refresh and try again.');
    alert('Order permanently deleted. It will no longer appear in orders, tracking, or TOTAL UNITS ORDERED.');
    await load();
  }catch(e){
    console.error(e);
    alert('Could not delete order: '+(e.message||JSON.stringify(e)));
  }
}
async function stat(id,v){
  const label=v==='PAID'?'approve this payment':'mark this payment as rejected';
  if(!confirm('Are you sure you want to '+label+'?'))return;
  try{
    const r=await s.rpc('ofa_set_payment_status_admin',{p_order_id:id,p_status:v});
    if(r.error)throw r.error;
    alert(v==='PAID'?'Payment approved successfully.':'Payment marked as rejected.');
    await load();
  }catch(e){
    console.error(e);
    alert('Could not update payment: '+(e.message||JSON.stringify(e)));
  }
}
async function wb(id){let v=prompt('Waybill / tracking number');if(v===null)return;let r=await s.from('ofa_waybills').update({waybill_number:v,tracking_number:v,status:v?'WAYBILL READY':'WAITING FOR WAYBILL',updated_at:new Date().toISOString()}).eq('id',id);if(r.error)alert(r.error.message);else load()}
async function editConsolidatedWaybill(email){const ords=(await s.from('ofa_orders').select('order_id').eq('email',email)).data||[];if(!ords.length)return;const v=prompt('Waybill / tracking number for ALL consolidated orders of '+email);if(v===null)return;for(const o of ords){let r=await s.from('ofa_waybills').update({waybill_number:v,tracking_number:v,status:v?'WAYBILL READY':'WAITING FOR WAYBILL',updated_at:new Date().toISOString()}).eq('order_id',o.order_id);if(r.error)console.error(r.error)}await load()}
async function printConsolidated(email){const [or,ir]=await Promise.all([s.from('ofa_orders').select('*').eq('email',email).order('created_at',{ascending:true}),s.from('ofa_order_items').select('*')]);const O2=or.data||[],all=ir.data||[],items=all.filter(x=>O2.some(o=>o.order_id===x.order_id));if(!O2.length)return;const products={};items.forEach(x=>products[x.product_name]=(products[x.product_name]||0)+(+x.qty||0));const qty=items.reduce((a,x)=>a+(+x.qty||0),0),first=O2[0],printWin=window.open('','_blank','width=850,height=700');printWin.document.write('<!doctype html><html><head><title>PEPMOSA MOQ Waybill</title><style>body{font-family:Arial;padding:28px;color:#302530}.box{border:2px solid #e83f9b;border-radius:18px;padding:24px;max-width:760px;margin:auto}h1{color:#d92f8d;margin:0}.top{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding-bottom:16px}.row{padding:10px 0;border-bottom:1px dashed #ddd}.qty{font-size:28px;font-weight:900;color:#d92f8d}.small{font-size:12px;color:#777}</style></head><body><div class="box"><div class="top"><div><h1>PEPMOSA</h1><b>MOQ / OPEN FOR ALL • CONSOLIDATED WAYBILL</b></div><div class="qty">'+qty+' TOTAL ITEMS</div></div><div class="row"><b>TO:</b><br>'+first.customer_name+'<br>'+first.contact+'<br>'+first.address+'</div><div class="row"><b>EMAIL:</b> '+email+'<br><span class="small">Consolidated from '+O2.length+' MOQ/Open for All checkout(s)</span></div><div class="row"><b>CONTENTS / TOTAL QUANTITY</b><br>'+Object.entries(products).map(([n,q])=>n+' × <b>'+q+'</b>').join('<br>')+'</div><div class="row"><b>ORDER IDS</b><br>'+O2.map(x=>x.order_id).join('<br>')+'</div><p class="small">Only MOQ/Open for All orders are included.</p></div><script>window.onload=function(){window.print()}<\/script></body></html>');printWin.document.close()}
async function save(){const b=document.getElementById('saveSettingsBtn');b.disabled=true;b.textContent='SAVING...';try{let data={id:true,payment_name:pay.value.trim()||null,payment_instructions:ins.value.trim()||null,luzon_fee:+lu.value||0,visayas_fee:+vi.value||0,mindanao_fee:+mi.value||0,lalamove_fee:+la.value||0,updated_at:new Date().toISOString()};let r=await s.from('ofa_settings').upsert(data,{onConflict:'id'}).select().single();if(r.error)throw r.error;let photoWarning='';if(qrfile.files[0]){try{let url=await upload(qrfile.files[0],'qr');let u=await s.from('ofa_settings').update({payment_qr_url:url,updated_at:new Date().toISOString()}).eq('id',true);if(u.error)throw u.error}catch(e){console.error('QR upload failed',e);photoWarning=' Settings were saved, but the QR image did not upload: '+(e.message||'unknown error')}}alert('MOQ settings saved!'+photoWarning);await load()}catch(e){console.error(e);alert('Could not save settings: '+(e.message||JSON.stringify(e)))}finally{b.disabled=false;b.textContent='SAVE SETTINGS'}}
document.getElementById('addProductBtn').onclick=addP;document.getElementById('saveSettingsBtn').addEventListener('click',save);
document.getElementById('pi').addEventListener('change',()=>{let f=document.getElementById('pi').files[0];if(f){document.getElementById('pprev').src=URL.createObjectURL(f);document.getElementById('pprev').style.display='block'}});qrfile.addEventListener('change',()=>{let f=qrfile.files[0];if(f){qrprev.src=URL.createObjectURL(f);qrprev.style.display='block'}});
boot().catch(e=>document.body.innerHTML='<div class="w"><div class="card"><h2>Admin error</h2><p>'+e.message+'</p></div></div>')
</script></body></html>
