<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open for All</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><style>
<style>
:root{--pink:#e83f9b;--pink2:#ff79bc;--purple:#b35ad6;--dark:#3b2633;--soft:#fff7fb;--line:#f2c9df;--muted:#8d7180;--cream:#fff1f8}
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:radial-gradient(circle at 8% 4%,#ffd9ec 0,transparent 25%),radial-gradient(circle at 92% 8%,#eadcff 0,transparent 28%),linear-gradient(180deg,#fff9fc,#fff3f8);color:var(--dark);min-height:100vh}body:before{content:"♡ ✦ ♡";position:fixed;inset:auto 5% 8% auto;color:#f5b4d2;font-size:48px;letter-spacing:18px;opacity:.3;pointer-events:none}
.w{max-width:1050px;margin:auto;padding:28px 18px 120px}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#f34aa5 0%,#d93b94 42%,#a84bc5 100%);color:#fff;border-radius:30px;padding:32px;box-shadow:0 20px 50px #df3c972d}.hero:before{content:"✦  ♡  ✦";position:absolute;right:28px;top:18px;font-size:24px;letter-spacing:8px;opacity:.4}.hero:after{content:"♡";position:absolute;right:28px;bottom:-32px;font-size:145px;opacity:.13}.brand{font-size:11px;font-weight:900;letter-spacing:2.5px;opacity:.9}.hero h1{margin:10px 0 8px;font-size:42px;letter-spacing:-1px}.hero p{margin:0;font-size:16px;opacity:.95}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.chip{background:#ffffff24;border:1px solid #ffffff55;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:800}
.section-head{display:flex;justify-content:space-between;align-items:end;margin:28px 0 13px}.section-kicker{font-size:11px;letter-spacing:2px;font-weight:900;color:var(--pink)}.section-head h2{margin:5px 0 0;font-size:29px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:17px}
.card{position:relative;background:linear-gradient(180deg,#fff,#fff9fc);border:1px solid var(--line);border-radius:24px;padding:15px;box-shadow:0 12px 28px #d76d9c18;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 18px 35px #d84a9424}.pic{width:100%;height:190px;object-fit:contain;background:linear-gradient(135deg,#fff2f8,#f8efff);border-radius:18px}.placeholder{height:190px;border-radius:18px;background:linear-gradient(135deg,#fff0f7,#f4ecff);display:grid;place-items:center;font-size:58px}.product-name{font-size:20px;margin:14px 0 8px}.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}.badge{background:#ffe4f1;color:#c72f83;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:900}.price{font-size:25px;font-weight:900;color:#d92f8d;margin:14px 0}.qtyrow{display:flex;gap:8px}.qtyrow input{width:78px;border:1px solid var(--line);border-radius:13px;padding:10px;font-weight:800;background:#fffafd}.btn{background:linear-gradient(135deg,#ee479f,#c24ebc);color:#fff;border:0;border-radius:13px;padding:12px 16px;font-weight:900;cursor:pointer;letter-spacing:.4px;box-shadow:0 8px 18px #d4378a30}.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}.qtyrow .btn{flex:1}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;width:min(1014px,calc(100% - 28px));background:linear-gradient(135deg,#3a2b34,#4a3040);color:#fff;padding:14px 16px;border-radius:20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 16px 40px #0004;z-index:10;border:1px solid #ffffff16}.cart-label{display:flex;flex-direction:column;gap:3px}.cart-label small{opacity:.65;font-weight:800;letter-spacing:1px}
.modal{display:none;position:fixed;inset:0;background:#2c1824b8;padding:15px;overflow:auto;z-index:30;backdrop-filter:blur(5px)}.modal.show{display:block}.box{max-width:700px;background:linear-gradient(180deg,#fff,#fff8fc);border:1px solid #f3cce0;border-radius:28px;padding:24px;margin:24px auto;box-shadow:0 25px 70px #35131f55}.box h2{margin:0 0 16px;color:#c82f83}.box h2:after{content:"  ♡";color:#ef6cac}.f{margin:13px 0;font-size:13px;font-weight:900;letter-spacing:.3px;color:#593847}.f input,.f textarea,.f select{width:100%;box-sizing:border-box;padding:13px;border:1px solid var(--line);border-radius:14px;margin-top:7px;font:inherit;background:#fff;outline:none;transition:.15s}.f input:focus,.f textarea:focus,.f select:focus{border-color:#ea58a8;box-shadow:0 0 0 3px #f8c7df55}.line{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px dashed #efcfdf}.payment-card{margin:16px 0;padding:16px;background:linear-gradient(135deg,#fff0f7,#faf1ff);border:1px dashed #e7a7cb;border-radius:20px}.notice{margin:12px 0;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,#fff0f7,#fff7e9);color:#8a4666;font-size:13px;border:1px solid #f0c6d8}.ship-choice{margin:12px 0;padding:13px;border-radius:16px;background:#fff6fb;border:1px solid #f3cde0;color:#8d4d6b;font-size:13px}.qrwrap{text-align:center}.qrwrap .pic{max-width:330px;height:220px;margin:auto;display:block;background:#fff;border:1px solid #f0d6e3}
.pop{display:none;position:fixed;inset:0;z-index:100;background:#2c182499;backdrop-filter:blur(6px);padding:20px;align-items:center;justify-content:center}.pop.show{display:flex}.popcard{width:min(420px,100%);background:linear-gradient(180deg,#fff,#fff4fa);border:1px solid #f3c8dd;border-radius:28px;padding:26px;text-align:center;box-shadow:0 28px 80px #35131f66}.popicon{width:68px;height:68px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ffb6da,#e24a9d);color:#fff;font-size:31px;box-shadow:0 12px 25px #dd4a9b45}.popcard h3{margin:4px 0 10px;font-size:24px;color:#c92f83}.popcard p{margin:0 0 18px;color:#795568;line-height:1.5}.popcard .btn{min-width:120px}
@media(max-width:600px){.w{padding:16px 13px 110px}.hero{padding:25px 20px;border-radius:24px}.hero h1{font-size:32px}.section-head h2{font-size:24px}.bar{bottom:10px;width:calc(100% - 20px);border-radius:16px}.bar .btn{padding:12px}.box{padding:18px;margin:8px auto;border-radius:23px}.pic,.placeholder{height:170px}.chips{gap:6px}.chip{font-size:11px}.popcard{padding:22px}}
</style></head><body><div class="w"><div class="hero"><div class="brand">PEPMOSA • DIRECT SHOP</div><h1>🌐 OPEN FOR ALL</h1><p>Shop separately from Group Buy — no Admin Fee, with separate payment and waybill.</p><div class="chips"><span class="chip">✓ No Admin Fee</span><span class="chip">✓ Separate Orders</span><span class="chip">✓ MOQ Available</span><span class="chip">✓ Shipping Per Checkout</span></div></div><div class="section-head"><div><div class="section-kicker">AVAILABLE NOW</div><h2>Shop Products</h2></div></div><div id="list" class="grid"></div><div class="bar"><div class="cart-label"><small>YOUR CART</small><span id="sum">0 item(s) • ₱0.00</span></div><button class="btn" onclick="checkout()">CHECKOUT →</button></div></div><div id="m" class="modal"><div id="box" class="box"></div></div><div id="pop" class="pop"><div class="popcard"><div id="popicon" class="popicon">♡</div><h3 id="poptitle">PEPMOSA</h3><p id="popmsg"></p><button class="btn" onclick="closePop()">OK ♡</button></div></div><script>
const S=()=>window.sb||initSupabase(),ofaPeso=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2});let P=[],C=[],SET={};
async function load(){
  try{
    const s=S();
    const [a,b]=await Promise.all([
      s.from('ofa_products').select('*').eq('status','AVAILABLE'),
      s.from('ofa_settings').select('*').eq('id',true).single()
    ]);
    if(a.error) throw a.error;
    P=a.data||[];
    SET=b.data||{};
    const list=document.getElementById('list');
    list.innerHTML=P.length
      ? P.map(x=>`<div class="card">${x.image_url?`<img class="pic" src="${x.image_url}">`:'<div class="placeholder">🧪</div>'}<h3 class="product-name">${x.name}</h3><div class="meta"><span class="badge">MOQ ${x.moq}</span><span>Available Now</span></div><div class="price">${ofaPeso(x.amount)}</div><div class="qtyrow"><input id="q${x.id}" type="number" min="${x.moq}" value="${x.moq}"><button class="btn" onclick="add('${x.id}')">ADD TO CART</button></div></div>`).join('')
      : '<div class="card" style="grid-column:1/-1;text-align:center;padding:30px"><h3>No products available yet</h3><p>Please check back soon.</p></div>';
    draw();
  }catch(err){
    console.error('Open for All load error:',err);
    document.getElementById('list').innerHTML='<div class="card" style="grid-column:1/-1;text-align:center;padding:30px"><h3>Unable to load products</h3><p>'+String(err.message||err)+'</p><button class="btn" onclick="load()">TRY AGAIN</button></div>';
  }
}
function add(id){let x=P.find(a=>a.id===id),q=Math.max(x.moq,+document.getElementById('q'+id).value||x.moq),z=C.find(a=>a.id===id);z?z.qty+=q:C.push({...x,qty:q});draw()}
function draw(){let sub=C.reduce((a,x)=>a+x.amount*x.qty,0);sum.textContent=C.reduce((a,x)=>a+x.qty,0)+' item(s) • '+ofaPeso(sub)}
function popup(title,msg,icon='♡'){poptitle.textContent=title;popmsg.textContent=msg;popicon.textContent=icon;pop.classList.add('show')}function closePop(){pop.classList.remove('show')}function checkout(){if(!C.length){popup('Your cart is empty','Add a product first before checking out.','🛍️');return;}m.classList.add('show');box.innerHTML='<h2>Checkout ♡</h2><div class="notice">♡ Shipping is charged per checkout/order. Even if you use the same email again, a new order will have its own shipping fee.</div>'+C.map(x=>'<div class="line"><span>'+x.name+' × '+x.qty+'</span><b>'+ofaPeso(x.amount*x.qty)+'</b></div>').join('')+'<div class="f">Email*<input id="e" type="email" placeholder="your@email.com"></div><div class="f">Name*<input id="n" placeholder="Full name"></div><div class="f">Contact<input id="c" placeholder="09XXXXXXXXX"></div><div class="f">Address*<textarea id="a" placeholder="Complete delivery address"></textarea></div><div class="f">Shipping Method<select id="sm" onchange="shippingChange()"><option value="JT_LUZON">J&T Luzon</option><option value="JT_VISAYAS">J&T Visayas</option><option value="JT_MINDANAO">J&T Mindanao</option><option value="LALAMOVE">Lalamove</option></select></div><div class="ship-choice" id="shipNote"></div><div id="tot"></div>'+(SET.payment_qr_url?'<div class="payment-card qrwrap"><h3>💗 Payment QR</h3><img class="pic" src="'+SET.payment_qr_url+'"><p><b>'+ (SET.payment_name||'PEPMOSA')+'</b></p><p>'+ (SET.payment_instructions||'')+'</p></div>':'')+'<div class="f">Proof of payment*<input id="proof" type="file" accept="image/*"></div><button class="btn" onclick="submit()">SUBMIT ORDER ♡</button>';total()}
function shippingChange(){total()}function fee(){let sm=document.getElementById('sm').value;if(sm==='LALAMOVE')return +SET.lalamove_fee||0;if(sm==='JT_VISAYAS')return +SET.visayas_fee||0;if(sm==='JT_MINDANAO')return +SET.mindanao_fee||0;return +SET.luzon_fee||0}
function total(){let sub=C.reduce((a,x)=>a+x.amount*x.qty,0),f=fee(),sm=document.getElementById('sm').value;let labels={JT_LUZON:'J&T Luzon',JT_VISAYAS:'J&T Visayas',JT_MINDANAO:'J&T Mindanao',LALAMOVE:'Lalamove'};shipNote.innerHTML='💗 <b>'+labels[sm]+'</b> selected.'+(sm==='LALAMOVE'?(f?' The configured Lalamove fee is included below.':' Delivery fee will be arranged/confirmed separately.'):' Shipping fee for this area is included below.');tot.innerHTML='<div class="line"><span>Shipping</span><b>'+ofaPeso(f)+'</b></div><div class="line"><b>TOTAL ♡</b><b>'+ofaPeso(sub+f)+'</b></div>'}
async function submit(){let email=e.value.trim(),name=n.value.trim(),address=a.value.trim(),file=proof.files[0];if(!email||!name||!address||!file){popup('Almost there!','Please complete all required fields and upload your proof of payment.','♡');return;}let id='OFA-'+Date.now(),s=S();try{let ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,''),path='open-for-all/'+id+'.'+ext,up=await s.storage.from('payment-proofs').upload(path,file,{contentType:file.type});if(up.error)throw up.error;let proofUrl=s.storage.from('payment-proofs').getPublicUrl(path).data.publicUrl,sub=C.reduce((a,x)=>a+x.amount*x.qty,0),f=fee();let o=await s.from('ofa_orders').insert({order_id:id,email,customer_name:name,contact:c.value.trim(),address,region:(document.getElementById('sm').value==='JT_VISAYAS'?'VISAYAS':document.getElementById('sm').value==='JT_MINDANAO'?'MINDANAO':'LUZON'),shipping_method:document.getElementById('sm').value,subtotal:sub,shipping_fee:f,total:sub+f,payment_reference:null,payment_proof_url:proofUrl}).select().single();if(o.error)throw o.error;let it=await s.from('ofa_order_items').insert(C.map(x=>({order_id:id,product_id:x.id,product_name:x.name,qty:x.qty,unit_price:x.amount,line_total:x.amount*x.qty})));if(it.error)throw it.error;await s.from('ofa_waybills').insert({order_id:id});m.classList.remove('show');C=[];draw();popup('Order Submitted! ♡','Your order '+id+' was submitted successfully and is now waiting for payment approval.','✓')}catch(err){console.error(err);popup('Something went wrong',err.message||'Please try again.','!')}}
load()</script></body></html>
