<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PEPMOSA • Manage Buyers Proof</title><link rel="stylesheet" href="style.css"><style>body{background:#fff9fc}.wrap{width:min(1050px,94%);margin:28px auto}.card{background:#fff;border:1px solid #ead9e5;border-radius:20px;padding:22px;margin-bottom:18px}.row{display:flex;gap:10px;flex-wrap:wrap}.item{display:flex;gap:14px;padding:14px;border-bottom:1px solid #eee;align-items:center}.item img{width:110px;height:110px;object-fit:cover;border-radius:12px}.status{font-size:12px;padding:5px 8px;border-radius:8px;background:#f6e5ef}.btn{padding:10px 14px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:#d72b91;color:#fff}.danger{background:#eee}.success{background:#2f9e62;color:#fff}.field{margin:12px 0}.field input,.field textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px}.tabs{display:flex;gap:8px;margin-bottom:15px}.tab{padding:10px 14px;border-radius:10px;border:1px solid #ead9e5;background:white;font-weight:800}.tab.active{background:#d72b91;color:white}.count{font-size:12px;background:#eee;padding:3px 7px;border-radius:10px}</style></head><body><header><a class="brand" href="index.html"><span class="logoMark">P</span>PEPMOSA</a></header><main class="wrap"><div class="card"><div class="eyebrow">ADMIN ONLY</div><h1>♥ Manage Buyers' Proof</h1><p class="muted">Review buyer submissions before publishing. Check and protect personal information first.</p><div id="msg"></div></div><div class="tabs"><button class="tab active" onclick="showTab('pending',this)">📥 PENDING <span id="pendingCount" class="count">0</span></button><button class="tab" onclick="showTab('published',this)">♥ PUBLISHED</button><button class="tab" onclick="showTab('comments',this)">💬 COMMENTS <span id="commentCount" class="count">0</span></button></div><div class="card"><div id="list">Loading...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script>const sb=initSupabase(),msg=document.getElementById('msg');let admin=false,tab='pending';function say(t,e=false){msg.textContent=t;msg.style.color=e?'#c22':'#378'}async function boot(){try{await requireAdmin();admin=true;await counts();load()}catch(e){say(e.message,true)}}async function counts(){const p=await sb.from('buyer_proofs').select('id',{count:'exact',head:true}).eq('status','pending');document.getElementById('pendingCount').textContent=p.count||0;const c=await sb.from('buyer_proof_comments').select('id',{count:'exact',head:true}).eq('is_approved',false);document.getElementById('commentCount').textContent=c.count||0}function showTab(t,b){tab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');load()}async function load(){const box=document.getElementById('list');box.textContent='Loading...';if(tab==='comments')return loadComments(box);let q=sb.from('buyer_proofs').select('*').order('created_at',{ascending:false});q=tab==='pending'?q.eq('status','pending'):q.eq('status','published');const {data,error}=await q;if(error){box.textContent=error.message;return}if(!data?.length){box.textContent='Nothing here yet.';return}box.innerHTML='';for(const p of data){const {data:u}=await sb.storage.from('buyer-proofs').createSignedUrl(p.image_path,3600);const d=document.createElement('div');d.className='item';d.innerHTML='<img src="'+(u?.signedUrl||'')+'"><div style="flex:1"><b>'+((p.caption)||'Buyers proof')+'</b><br><small>From: '+(p.submitter_display_name||'Anonymous')+'</small><br><span class="status">'+p.status.toUpperCase()+'</span></div><div class="row"></div>';const actions=d.querySelector('.row');if(tab==='pending'){const approve=document.createElement('button');approve.className='btn success';approve.textContent='✓ PUBLISH';approve.onclick=async()=>{if(!confirm('Publish this proof publicly? Make sure sensitive information is hidden first.'))return;const np='published/'+p.image_path.split('/').pop();const cp=await sb.storage.from('buyer-proofs').copy(p.image_path,np);if(cp.error)return alert(cp.error.message);await sb.from('buyer_proofs').update({image_path:np,status:'published',is_published:true}).eq('id',p.id);await sb.storage.from('buyer-proofs').remove([p.image_path]);counts();load()};actions.appendChild(approve);const reject=document.createElement('button');reject.className='btn danger';reject.textContent='REJECT';reject.onclick=async()=>{if(!confirm('Reject and delete this submission?'))return;await sb.storage.from('buyer-proofs').remove([p.image_path]);await sb.from('buyer_proofs').update({status:'rejected',is_published:false}).eq('id',p.id);counts();load()};actions.appendChild(reject)}else{const del=document.createElement('button');del.className='btn danger';del.textContent='DELETE';del.onclick=async()=>{if(!confirm('Delete?'))return;await sb.storage.from('buyer-proofs').remove([p.image_path]);await sb.from('buyer_proofs').delete().eq('id',p.id);load()};actions.appendChild(del)}box.appendChild(d)}}async function loadComments(box){const {data,error}=await sb.from('buyer_proof_comments').select('*,buyer_proofs(caption)').order('created_at',{ascending:false});if(error){box.textContent=error.message;return}if(!data?.length){box.textContent='No comments yet.';return}box.innerHTML='';for(const c of data){const d=document.createElement('div');d.className='item';d.innerHTML='<div style="flex:1"><b>'+((c.display_name)||'Buyer')+'</b><br>'+c.comment+'<br><small>On: '+(c.buyer_proofs?.caption||'Buyers proof')+'</small><br><span class="status">'+(c.is_approved?'APPROVED':'PENDING')+'</span></div><div class="row"></div>';const a=d.querySelector('.row');if(!c.is_approved){const ok=document.createElement('button');ok.className='btn success';ok.textContent='✓ APPROVE';ok.onclick=async()=>{await sb.from('buyer_proof_comments').update({is_approved:true}).eq('id',c.id);counts();load()};a.appendChild(ok)}const del=document.createElement('button');del.className='btn danger';del.textContent='DELETE';del.onclick=async()=>{await sb.from('buyer_proof_comments').delete().eq('id',c.id);counts();load()};a.appendChild(del);box.appendChild(d)}}boot()</script></body></html>
