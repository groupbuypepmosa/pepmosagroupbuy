<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open for All</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><style>body{font-family:Arial;margin:0;background:#fff8fb;color:#34262e}.w{max-width:900px;margin:auto;padding:22px}.hero{background:linear-gradient(135deg,#e82f91,#b64fc8);color:#fff;border-radius:24px;padding:26px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:18px 0}.card{background:#fff;border:1px solid #ecdde5;border-radius:18px;padding:15px}.pic{width:100%;height:180px;object-fit:contain}.price{font-size:22px;font-weight:900;color:#c32f8b}.btn{background:#c32f8b;color:#fff;border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.bar{position:sticky;bottom:12px;background:#34262e;color:#fff;padding:15px;border-radius:16px;display:flex;justify-content:space-between}.modal{display:none;position:fixed;inset:0;background:#0008;padding:15px;overflow:auto}.modal.show{display:block}.box{max-width:620px;background:#fff;border-radius:20px;padding:20px;margin:20px auto}.f{margin:9px 0}.f input,.f textarea,.f select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:10px}.line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}</style></head><body><div class="w"><div class="hero"><b>PEPMOSA</b><h1>🌐 OPEN FOR ALL</h1><p>Separate checkout • No Admin Fee • Separate payment and waybill</p></div><div id="list" class="grid"></div><div class="bar"><span id="sum">0 item(s) • ₱0.00</span><button class="btn" onclick="checkout()">CHECKOUT</button></div></div><div id="m" class="modal"><div id="box" class="box"></div></div><script>
const S=()=>window.sb||initSupabase(),ofaPeso=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2});let P=[],C=[],SET={};
async function load(){
  try{
    const s=S();
    const [a,b]=await Promise.all([
      s.from('ofa_products').select('*').eq('status','AVAILABLE'),
      s.from('ofa_settings').select('*').eq('id',true).single()
    ]);
    if(a.error) throw a.error;
    P=a.data||[];
    SET=b.data||{};
    const list=document.getElementById('list');
    list.innerHTML=P.length
      ? P.map(x=>'<div class="card">'+(x.image_url?'<img class="pic" src="'+x.image_url+'">':'')+'<h3>'+x.name+'</h3><div>MOQ: '+x.moq+'</div><div class="price">'+ofaPeso(x.amount)+'</div><input id="q'+x.id+'" type="number" min="'+x.moq+'" value="'+x.moq+'"> <button class="btn" onclick="add(\\''+x.id+'\\')">ADD</button></div>').join('')
      : '<div class="card" style="grid-column:1/-1;text-align:center;padding:30px"><h3>No products available yet</h3><p>Please check back soon.</p></div>';
    draw();
  }catch(err){
    console.error('Open for All load error:',err);
    document.getElementById('list').innerHTML='<div class="card" style="grid-column:1/-1;text-align:center;padding:30px"><h3>Unable to load products</h3><p>'+String(err.message||err)+'</p><button class="btn" onclick="load()">TRY AGAIN</button></div>';
  }
}
function add(id){let x=P.find(a=>a.id===id),q=Math.max(x.moq,+document.getElementById('q'+id).value||x.moq),z=C.find(a=>a.id===id);z?z.qty+=q:C.push({...x,qty:q});draw()}
function draw(){let sub=C.reduce((a,x)=>a+x.amount*x.qty,0);sum.textContent=C.reduce((a,x)=>a+x.qty,0)+' item(s) • '+ofaPeso(sub)}
function checkout(){if(!C.length)return alert('Add a product first.');m.classList.add('show');box.innerHTML='<h2>Checkout</h2>'+C.map(x=>'<div class="line"><span>'+x.name+' × '+x.qty+'</span><b>'+ofaPeso(x.amount*x.qty)+'</b></div>').join('')+'<div class="f">Email*<input id="e" type="email"></div><div class="f">Name*<input id="n"></div><div class="f">Contact<input id="c"></div><div class="f">Address*<textarea id="a"></textarea></div><div class="f">Shipping Method<select id="sm" onchange="shippingChange()"><option value="COURIER">Regular Courier</option><option value="LALAMOVE">Lalamove</option></select></div><div class="f">Region<select id="r" onchange="total()"><option value="LUZON">Luzon</option><option value="VISAYAS">Visayas</option><option value="MINDANAO">Mindanao</option></select></div><div id="shipNote" style="margin:8px 0;color:#8a526b;font-size:13px"></div><div id="tot"></div>'+(SET.payment_qr_url?'<div class="card"><h3>Payment QR</h3><img class="pic" src="'+SET.payment_qr_url+'"><p>'+ (SET.payment_name||'')+'</p><p>'+ (SET.payment_instructions||'')+'</p></div>':'')+'<div class="f">Payment reference<input id="ref"></div><div class="f">Proof of payment*<input id="proof" type="file" accept="image/*"></div><button class="btn" onclick="submit()">SUBMIT ORDER</button>';total()}
function shippingChange(){total()}function fee(){let sm=document.getElementById('sm').value;if(sm==='LALAMOVE')return +SET.lalamove_fee||0;let r=document.getElementById('r').value;return +(r==='VISAYAS'?SET.visayas_fee:r==='MINDANAO'?SET.mindanao_fee:SET.luzon_fee)||0}
function total(){let sub=C.reduce((a,x)=>a+x.amount*x.qty,0),f=fee(),sm=document.getElementById('sm').value;shipNote.textContent=sm==='LALAMOVE'?(f?'Lalamove selected. The configured Lalamove shipping fee is included below.':'Lalamove selected. Shipping fee will be arranged/confirmed separately.'):'Regular courier shipping fee is based on your region.';tot.innerHTML='<div class="line"><span>'+ (sm==='LALAMOVE'?'Lalamove Shipping':'Shipping') +'</span><b>'+ofaPeso(f)+'</b></div><div class="line"><b>TOTAL</b><b>'+ofaPeso(sub+f)+'</b></div>'}
async function submit(){let email=e.value.trim(),name=n.value.trim(),address=a.value.trim(),file=proof.files[0];if(!email||!name||!address||!file)return alert('Complete required fields.');let id='OFA-'+Date.now(),s=S();try{let ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,''),path='open-for-all/'+id+'.'+ext,up=await s.storage.from('payment-proofs').upload(path,file,{contentType:file.type});if(up.error)throw up.error;let proofUrl=s.storage.from('payment-proofs').getPublicUrl(path).data.publicUrl,sub=C.reduce((a,x)=>a+x.amount*x.qty,0),f=fee();let o=await s.from('ofa_orders').insert({order_id:id,email,customer_name:name,contact:c.value.trim(),address,region:r.value,shipping_method:document.getElementById('sm').value,subtotal:sub,shipping_fee:f,total:sub+f,payment_reference:ref.value.trim()||null,payment_proof_url:proofUrl}).select().single();if(o.error)throw o.error;let it=await s.from('ofa_order_items').insert(C.map(x=>({order_id:id,product_id:x.id,product_name:x.name,qty:x.qty,unit_price:x.amount,line_total:x.amount*x.qty})));if(it.error)throw it.error;await s.from('ofa_waybills').insert({order_id:id});alert('Submitted! '+id+' — waiting for payment approval.');C=[];draw();m.classList.remove('show')}catch(err){alert(err.message)}}
load()</script></body></html>
