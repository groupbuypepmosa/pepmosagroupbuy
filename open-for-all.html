<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open for All</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><style>
:root{--pink:#d92f8d;--purple:#a843bd;--dark:#33262e;--soft:#fff8fb;--line:#edd8e5;--muted:#85747d}
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:radial-gradient(circle at top left,#ffe5f2 0,transparent 32%),radial-gradient(circle at top right,#eee3ff 0,transparent 30%),#fff9fc;color:var(--dark)}
.w{max-width:1050px;margin:auto;padding:26px 18px 110px}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;border-radius:28px;padding:30px;box-shadow:0 18px 45px #b62b7b35}.hero:after{content:"♡";position:absolute;right:28px;bottom:-25px;font-size:130px;opacity:.14}.brand{font-size:12px;font-weight:900;letter-spacing:2px;opacity:.9}.hero h1{margin:10px 0 8px;font-size:42px;letter-spacing:-1px}.hero p{margin:0;font-size:16px;opacity:.94}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.chip{background:#ffffff20;border:1px solid #ffffff42;padding:8px 11px;border-radius:999px;font-size:12px;font-weight:700}
.section-head{display:flex;justify-content:space-between;align-items:end;margin:26px 0 12px}.section-kicker{font-size:11px;letter-spacing:2px;font-weight:900;color:var(--pink)}.section-head h2{margin:5px 0 0;font-size:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:16px;margin:0}
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:22px;padding:15px;box-shadow:0 10px 25px #b9819d12;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 15px 32px #b9819d22}.pic{width:100%;height:190px;object-fit:contain;background:linear-gradient(135deg,#fff6fa,#f7efff);border-radius:16px}.placeholder{height:190px;border-radius:16px;background:linear-gradient(135deg,#fff1f8,#f4ecff);display:grid;place-items:center;font-size:58px}.product-name{font-size:20px;margin:14px 0 8px}.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}.badge{background:#f7e8f1;color:var(--pink);border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900}.price{font-size:25px;font-weight:900;color:var(--pink);margin:14px 0}.qtyrow{display:flex;gap:8px}.qtyrow input{width:76px;border:1px solid var(--line);border-radius:12px;padding:10px;font-weight:700}.btn{background:linear-gradient(135deg,var(--pink),#b54ab9);color:#fff;border:0;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer;letter-spacing:.3px}.btn:hover{filter:brightness(1.04)}.qtyrow .btn{flex:1}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;width:min(1014px,calc(100% - 28px));background:#342a31;color:#fff;padding:14px 16px;border-radius:18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 15px 35px #0003;z-index:10}.cart-label{display:flex;flex-direction:column;gap:3px}.cart-label small{opacity:.65}.modal{display:none;position:fixed;inset:0;background:#26151ddd;padding:15px;overflow:auto;z-index:30}.modal.show{display:block}.box{max-width:680px;background:#fff;border-radius:24px;padding:22px;margin:24px auto;box-shadow:0 25px 70px #0004}.box h2{margin:0 0 16px}.f{margin:12px 0;font-size:13px;font-weight:800}.f input,.f textarea,.f select{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:6px;font:inherit;background:#fff}.line{display:flex;justify-content:space-between;gap:15px;padding:11px 0;border-bottom:1px solid #f1e8ed}.payment-card{margin:14px 0;padding:14px;background:#fff8fb;border:1px dashed #e8b9d2;border-radius:16px}.notice{margin:12px 0;padding:11px 13px;border-radius:12px;background:#fff5d9;color:#76551b;font-size:13px}
@media(max-width:600px){.w{padding:16px 13px 105px}.hero{padding:24px 20px;border-radius:22px}.hero h1{font-size:32px}.section-head h2{font-size:24px}.bar{bottom:10px;width:calc(100% - 20px);border-radius:15px}.bar .btn{padding:12px}.box{padding:18px;margin:8px auto}.pic,.placeholder{height:170px}}
</style></head><body><div class="w"><div class="hero"><div class="brand">PEPMOSA • DIRECT SHOP</div><h1>🌐 OPEN FOR ALL</h1><p>Shop separately from Group Buy — no Admin Fee, with separate payment and waybill.</p><div class="chips"><span class="chip">✓ No Admin Fee</span><span class="chip">✓ Separate Orders</span><span class="chip">✓ MOQ Available</span><span class="chip">✓ Shipping Per Checkout</span></div></div><div class="section-head"><div><div class="section-kicker">AVAILABLE NOW</div><h2>Shop Products</h2></div></div><div id="list" class="grid"></div><div class="bar"><div class="cart-label"><small>YOUR CART</small><span id="sum">0 item(s) • ₱0.00</span></div><button class="btn" onclick="checkout()">CHECKOUT →</button></div></div><div id="m" class="modal"><div id="box" class="box"></div></div><script>
const S=()=>window.sb||initSupabase(),ofaPeso=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2});let P=[],C=[],SET={};
async function load(){
  try{
    const s=S();
    const [a,b]=await Promise.all([
      s.from('ofa_products').select('*').eq('status','AVAILABLE'),
      s.from('ofa_settings').select('*').eq('id',true).single()
    ]);
    if(a.error) throw a.error;
    P=a.data||[];
    SET=b.data||{};
    const list=document.getElementById('list');
    list.innerHTML=P.length
      ? P.map(x=>`<div class="card">${x.image_url?`<img class="pic" src="${x.image_url}">`:'<div class="placeholder">🧪</div>'}<h3 class="product-name">${x.name}</h3><div class="meta"><span class="badge">MOQ ${x.moq}</span><span>Available Now</span></div><div class="price">${ofaPeso(x.amount)}</div><div class="qtyrow"><input id="q${x.id}" type="number" min="${x.moq}" value="${x.moq}"><button class="btn" onclick="add('${x.id}')">ADD TO CART</button></div></div>`).join('')
      : '<div class="card" style="grid-column:1/-1;text-align:center;padding:30px"><h3>No products available yet</h3><p>Please check back soon.</p></div>';
    draw();
  }catch(err){
    console.error('Open for All load error:',err);
    document.getElementById('list').innerHTML='<div class="card" style="grid-column:1/-1;text-align:center;padding:30px"><h3>Unable to load products</h3><p>'+String(err.message||err)+'</p><button class="btn" onclick="load()">TRY AGAIN</button></div>';
  }
}
function add(id){let x=P.find(a=>a.id===id),q=Math.max(x.moq,+document.getElementById('q'+id).value||x.moq),z=C.find(a=>a.id===id);z?z.qty+=q:C.push({...x,qty:q});draw()}
function draw(){let sub=C.reduce((a,x)=>a+x.amount*x.qty,0);sum.textContent=C.reduce((a,x)=>a+x.qty,0)+' item(s) • '+ofaPeso(sub)}
function checkout(){if(!C.length)return alert('Add a product first.');m.classList.add('show');box.innerHTML='<h2>🛍️ Checkout</h2><div class="notice">Shipping is charged for this checkout/order. Using the same email on a future order does not automatically waive shipping.</div>'+C.map(x=>'<div class="line"><span>'+x.name+' × '+x.qty+'</span><b>'+ofaPeso(x.amount*x.qty)+'</b></div>').join('')+'<div class="f">Email*<input id="e" type="email"></div><div class="f">Name*<input id="n"></div><div class="f">Contact<input id="c"></div><div class="f">Address*<textarea id="a"></textarea></div><div class="f">Shipping Method<select id="sm" onchange="shippingChange()"><option value="COURIER">Regular Courier</option><option value="LALAMOVE">Lalamove</option></select></div><div class="f">Region<select id="r" onchange="total()"><option value="LUZON">Luzon</option><option value="VISAYAS">Visayas</option><option value="MINDANAO">Mindanao</option></select></div><div id="shipNote" style="margin:8px 0;color:#8a526b;font-size:13px"></div><div id="tot"></div>'+(SET.payment_qr_url?'<div class="card"><h3>Payment QR</h3><img class="pic" src="'+SET.payment_qr_url+'"><p>'+ (SET.payment_name||'')+'</p><p>'+ (SET.payment_instructions||'')+'</p></div>':'')+'<div class="f">Payment reference<input id="ref"></div><div class="f">Proof of payment*<input id="proof" type="file" accept="image/*"></div><button class="btn" onclick="submit()">SUBMIT ORDER</button>';total()}
function shippingChange(){total()}function fee(){let sm=document.getElementById('sm').value;if(sm==='LALAMOVE')return +SET.lalamove_fee||0;let r=document.getElementById('r').value;return +(r==='VISAYAS'?SET.visayas_fee:r==='MINDANAO'?SET.mindanao_fee:SET.luzon_fee)||0}
function total(){let sub=C.reduce((a,x)=>a+x.amount*x.qty,0),f=fee(),sm=document.getElementById('sm').value;shipNote.textContent=sm==='LALAMOVE'?(f?'Lalamove selected. The configured Lalamove shipping fee is included below.':'Lalamove selected. Shipping fee will be arranged/confirmed separately.'):'Regular courier shipping fee is based on your region.';tot.innerHTML='<div class="line"><span>'+ (sm==='LALAMOVE'?'Lalamove Shipping':'Shipping') +'</span><b>'+ofaPeso(f)+'</b></div><div class="line"><b>TOTAL</b><b>'+ofaPeso(sub+f)+'</b></div>'}
async function submit(){let email=e.value.trim(),name=n.value.trim(),address=a.value.trim(),file=proof.files[0];if(!email||!name||!address||!file)return alert('Complete required fields.');let id='OFA-'+Date.now(),s=S();try{let ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,''),path='open-for-all/'+id+'.'+ext,up=await s.storage.from('payment-proofs').upload(path,file,{contentType:file.type});if(up.error)throw up.error;let proofUrl=s.storage.from('payment-proofs').getPublicUrl(path).data.publicUrl,sub=C.reduce((a,x)=>a+x.amount*x.qty,0),f=fee();let o=await s.from('ofa_orders').insert({order_id:id,email,customer_name:name,contact:c.value.trim(),address,region:r.value,shipping_method:document.getElementById('sm').value,subtotal:sub,shipping_fee:f,total:sub+f,payment_reference:ref.value.trim()||null,payment_proof_url:proofUrl}).select().single();if(o.error)throw o.error;let it=await s.from('ofa_order_items').insert(C.map(x=>({order_id:id,product_id:x.id,product_name:x.name,qty:x.qty,unit_price:x.amount,line_total:x.amount*x.qty})));if(it.error)throw it.error;await s.from('ofa_waybills').insert({order_id:id});alert('Submitted! '+id+' — waiting for payment approval.');C=[];draw();m.classList.remove('show')}catch(err){alert(err.message)}}
load()</script></body></html>
