<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PEPMOSA • Track</title><link rel="stylesheet" href="style.css"><style>.trackCard{margin-top:16px}.trackStatus{font-size:18px;font-weight:900}.trackTimeline{display:flex;gap:5px;overflow:auto;padding:14px 0}.trackDot{min-width:130px;padding:9px;border-radius:10px;background:#eee9ed;font-size:10px;font-weight:900;text-align:center}.trackDot.current{background:#d72b91;color:#fff}.trackDot.done{background:#e5f7ed;color:#147644}</style></head><body><header><a class="brand" href="index.html"><span class="logoMark">P</span>PEPMOSA</a><nav class="nav"><a href="index.html">HOME</a><a href="calculator.html">CALCULATOR</a><a href="protocols.html">PROTOCOLS</a><a href="track.html">TRACK</a><a href="coa.html">COA</a></nav></header><main class="wrap"><section class="hero"><div><div class="eyebrow">ORDER TRACKING</div><h1>Track Your Order</h1><p class="muted">Enter the email used with your order.</p></div></section><section class="card trackCard"><input id="email" class="input" placeholder="Email" type="email" onkeydown="if(event.key==='Enter')track()"><div class="actions"><button class="btn primary" onclick="track()">TRACK ORDER</button></div><div id="out"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script>initSupabase();const STATUSES=['ORDER RECEIVED','PAYMENT CONFIRMED','ORDER PROCESSING','IN TRANSIT TO THE PHILIPPINES','ARRIVED IN THE PHILIPPINES','RECEIVED AT WAREHOUSE','PACKING & LABELLING','HANDED OVER TO LOCAL COURIER','DELIVERED'];function $(id){return document.getElementById(id)}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]) )}function peso(v){return '₱'+Number(v||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}async function track(){const e=$('email').value.trim().toLowerCase();if(!e)return;const out=$('out');out.innerHTML='<div class="notice">Loading your tracking details…</div>';try{const r=await sb.rpc('get_customer_tracking',{p_email:e});if(r.error)throw r.error;const data=r.data||{},orders=data.orders||[],shipments=data.shipments||[];if(!orders.length&&!shipments.length){out.innerHTML='<div class="notice">No orders found for this email.</div>';return}out.innerHTML=(shipments.length?shipments.map(s=>{const ci=STATUSES.indexOf(s.status);return `<div class="card"><div class="row"><div><div class="eyebrow">CONSOLIDATED SHIPMENT</div><b>${esc(s.shipment_id)}</b></div><div class="trackStatus">${esc(s.status)}</div></div>${s.tracking_number?`<div class="row"><span>Tracking</span><b>${esc(s.tracking_number)}</b></div>`:''}${s.waybill_number?`<div class="row"><span>Waybill</span><b>${esc(s.waybill_number)}</b></div>`:''}<div class="trackTimeline">${STATUSES.map((x,i)=>`<div class="trackDot ${i===ci?'current':i<ci?'done':''}">${esc(x)}</div>`).join('')}</div>${s.notes?`<div class="notice">${esc(s.notes)}</div>`:''}</div>`}).join(''):'')+(orders.length?`<div class="card"><h2>Your Orders</h2>${orders.map(o=>`<div class="row"><span><b>${esc(o.order_id)}</b><br><small>GB ${esc(o.gb_number)}</small></span><span><b>${peso(o.total)}</b><br><small>${esc(o.payment_status)}</small></span></div>`).join('')}</div>`:'')}catch(e){console.error(e);out.innerHTML='<div class="notice error">Unable to load tracking. Please try again.</div>'}}</script></body></html>
