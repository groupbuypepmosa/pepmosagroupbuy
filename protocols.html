<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PEPMOSA • Protocols</title><style>:root{--ink:#332832;--muted:#786d75;--pink:#d91f7b;--pink2:#b72f9a;--line:#efd7e3;--soft:#fff8fb}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 10%,#fff 0 12%,transparent 32%),linear-gradient(135deg,#fff9fc,#fff1f7 55%,#faf5ff);min-height:100vh}a{text-decoration:none;color:inherit}.top{max-width:1280px;margin:auto;padding:22px 34px 0}.back{display:inline-flex;gap:8px;align-items:center;color:#a22d65;font-weight:800;font-size:14px}.back:hover{color:var(--pink)}.page{max-width:980px;margin:auto;padding:20px 34px 60px}.brand{text-align:center;margin:10px 0 8px}.brand img{width:58px;height:58px;object-fit:contain;display:block;margin:0 auto 4px}.brand b{display:block;font-family:Georgia,serif;letter-spacing:.12em;font-size:25px}.brand span{display:block;font-size:10px;letter-spacing:.28em;font-weight:800;color:#a64a73}.hero{text-align:center;margin:4px auto 30px}.eyebrow{color:#b22e73;font-size:10px;font-weight:950;letter-spacing:.24em;margin-bottom:8px}.hero h1{font-family:Georgia,serif;font-size:clamp(48px,7vw,82px);line-height:.95;margin:0;color:#2e242d;letter-spacing:-3px}.hero h1 em{font-style:normal;color:var(--pink)}.hero p{max-width:680px;margin:16px auto 0;color:#6f6670;line-height:1.65}.library{background:rgba(255,255,255,.78);border:1px solid var(--line);border-radius:28px;padding:18px;box-shadow:0 18px 50px rgba(170,69,122,.08)}.libraryHead{padding:8px 8px 18px;border-bottom:1px solid #f1dfe7;margin-bottom:10px}.libraryHead b{display:block;font-size:18px}.libraryHead span{font-size:12px;color:var(--muted)}.docCard{position:relative;background:linear-gradient(135deg,#fff,#fff8fb);border:1px solid #f0d7e4;border-radius:20px;padding:18px;margin:12px 0;display:flex;justify-content:space-between;gap:16px;align-items:center;box-shadow:0 10px 28px rgba(170,69,122,.05)}.docCard:before{content:"✦";color:#d94d92;font-size:20px;margin-right:2px}.docMain{flex:1}.docCard h3{margin:0 0 5px;font-size:17px}.docCard p{margin:0;color:var(--muted);font-size:13px}.docBtn{border:0;padding:12px 18px;border-radius:14px;background:linear-gradient(135deg,#ee4f9c,#c71b74 55%,#a93ca9);color:#fff;font-weight:900;cursor:pointer;box-shadow:0 12px 24px rgba(207,43,127,.18)}.docBtn:hover{transform:translateY(-1px)}.empty,.notice{padding:30px 18px;text-align:center;color:#806f7b;border:1px dashed #ecc9da;border-radius:18px;background:#fff9fc}.notice.error{color:#a22d65;background:#fff4f8}.footer{text-align:center;margin-top:18px;color:#cf4d8c;font-family:Georgia,serif;font-size:18px}@media(max-width:680px){.top{padding:16px 18px 0}.page{padding:14px 18px 36px}.hero h1{letter-spacing:-2px}.library{padding:13px;border-radius:22px}.docCard{align-items:flex-start;flex-direction:column}.docBtn{width:100%}}</style></head><body><div class="top"><a class="back" href="index.html">← <span>Back to Shop</span></a></div><main class="page"><div class="brand"><img src="https://raw.githubusercontent.com/groupbuypepmosa/pepmosagroupbuy/main/pepmosa-logo.png" alt="PEPMOSA"><b>PEPMOSA</b><span>GROUP BUY</span></div><section class="hero"><div class="eyebrow">REFERENCE LIBRARY</div><h1>Protocols <em></em> ✧</h1><p>Browse available reference guides and protocols uploaded by PEPMOSA in one clean library.</p></section><section class="library"><div class="libraryHead"><b>Protocols</b><span>Available reference documents from PEPMOSA.</span></div><section id="documents"><div class="empty">Loading documents…</div></section></section><div class="footer">♡ PEPMOSA GROUP BUY ♡</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260903-library-live"></script><script src="supabase.js?v=20260903-library-live"></script><script>
(function(){
 const TYPE="PROTOCOL";
 const escDoc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
 async function boot(){
  const box=document.getElementById('documents');
  try{
   if(!box) throw new Error('Library container is missing.');
   box.innerHTML='<div class="empty">Loading protocols…</div>';
   if(!window.supabase) throw new Error('Supabase failed to load.');
   const client=initSupabase();
   const {data,error}=await client.from('library_documents').select('id,document_type,title,product_name,file_path,file_name,mime_type,created_at').eq('document_type',TYPE).order('created_at',{ascending:false});
   if(error) throw error;
   if(!data?.length){box.innerHTML='<div class="empty">No protocols uploaded yet.</div>';return;}
   box.innerHTML=data.map(d=>'<article class="docCard"><div class="docMain"><h3>'+escDoc(d.title||'Document')+'</h3><p>'+escDoc(d.product_name||d.file_name||'Reference document')+'</p></div><button class="docBtn" type="button" data-path="'+escDoc(d.file_path||'')+'">OPEN DOCUMENT →</button></article>').join('');
   box.querySelectorAll('.docBtn').forEach(btn=>btn.addEventListener('click',async()=>{
    try{
     const path=btn.dataset.path;if(!path) throw new Error('File path is missing.');
     const original=btn.textContent;btn.disabled=true;btn.textContent='OPENING…';
     const {data,error}=await client.storage.from('library-documents').createSignedUrl(path,3600);
     if(error) throw error;
     if(!data?.signedUrl) throw new Error('Unable to create document link.');
     window.open(data.signedUrl,'_blank','noopener');
     btn.disabled=false;btn.textContent=original;
    }catch(e){alert('Unable to open document: '+(e?.message||'Unknown error'));btn.disabled=false;btn.textContent='OPEN DOCUMENT →';}
   }));
  }catch(e){
   console.error('PROTOCOL LIBRARY ERROR',e);
   box.innerHTML='<div class="notice error"><b>protocols could not load.</b><br>'+escDoc(e?.message||'Unknown error')+'</div>';
  }
 }
 if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot,{once:true}); else boot();
})();
</script></body></html>
