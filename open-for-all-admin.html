<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open for All Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><style>
:root{--pink:#cc2d88;--dark:#2d2730;--soft:#fff8fb;--line:#edd8e5}*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff8fb,#f6effa);margin:0;color:var(--dark)}.w{max-width:1180px;margin:auto;padding:28px 18px}.hero{background:linear-gradient(135deg,#d92f8d,#a843bd);color:#fff;border-radius:26px;padding:26px 30px;box-shadow:0 15px 40px #b62b7b33}.hero h1{margin:0 0 6px}.hero p{margin:0;opacity:.9}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:20px}.stat{padding:18px}.stat .num{font-size:28px;font-weight:900;color:var(--pink);margin-top:7px}.card{padding:20px;margin:15px 0}.card h2{margin:0 0 15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:13px}.f input,.f textarea,.f select{width:100%;padding:12px;border:1px solid #e2cbd8;border-radius:11px;font:inherit;background:#fff}.btn{background:var(--pink);color:#fff;border:0;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer}.btn.alt{background:#fff;color:var(--pink);border:1px solid var(--pink)}.row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:14px 0;border-bottom:1px solid #f0e6ec}.empty{padding:22px;text-align:center;color:#8a7b84;background:#fff8fb;border-radius:12px}.preview{width:110px;height:110px;object-fit:contain;border:1px dashed #e0b8cf;border-radius:12px;padding:5px;margin-top:8px}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:12px;color:#8a7b84}.tag{display:inline-block;background:#fff0f7;color:var(--pink);padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.row{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="w">
<div class="hero"><h1>🌐 Open for All Admin</h1><p>Completely separate from Group Buy — Products • Payments • Waybills • Totals</p></div>
<div id="stats" class="stats"></div>
<div class="card"><h2>➕ Add Product</h2><div class="grid"><label class="f">Product Name<input id="pn" placeholder="e.g. Tirzepatide 15mg"></label><label class="f">Amount<input id="pa" type="number" placeholder="0"></label><label class="f">MOQ<input id="pm" type="number" value="1"></label><label class="f">Product Photo<input id="pi" type="file" accept="image/png,image/jpeg,image/webp"></label></div><img id="pprev" class="preview" style="display:none"><br><button id="addProductBtn" type="button" class="btn">ADD PRODUCT</button><div id="saveStatus" class="small" style="margin-top:10px"></div><div id="plist"></div></div>
<div class="card"><h2>💳 Payments / Approval</h2><div id="payments"></div></div>
<div class="card"><h2>🚚 Waybills</h2><div id="ways"></div></div>
<div class="card"><h2>📱 Separate QR & Shipping</h2><div class="grid"><label class="f">Payment QR Image<input id="qrfile" type="file" accept="image/png,image/jpeg,image/webp"></label><label class="f">Payment Name<input id="pay" placeholder="Account / payment name"></label><label class="f">Luzon Shipping<input id="lu" type="number"></label><label class="f">Visayas Shipping<input id="vi" type="number"></label><label class="f">Mindanao Shipping<input id="mi" type="number"></label><label class="f">Lalamove Shipping<input id="la" type="number" placeholder="0"></label></div><img id="qrprev" class="preview" style="display:none"><label class="f" style="margin-top:12px">Instructions<textarea id="ins" placeholder="Payment instructions"></textarea></label><br><button id="saveSettingsBtn" type="button" class="btn">SAVE SETTINGS</button></div>
</div><script>
let s,settings={};const peso=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2});
const empty=t=>'<div class="empty">'+t+'</div>';
async function boot(){s=initSupabase();await requireAdmin();await load()}
async function load(){let [o,p,w,st]=await Promise.all([s.from('ofa_orders').select('*').order('created_at',{ascending:false}),s.from('ofa_products').select('*').order('created_at',{ascending:false}),s.from('ofa_waybills').select('*').order('created_at',{ascending:false}),s.from('ofa_settings').select('*').eq('id',true).single()]);if(o.error||p.error||w.error)console.error(o.error||p.error||w.error);let O=o.data||[],sales=O.filter(x=>x.payment_status==='PAID').reduce((a,x)=>a+(+x.total||0),0),pending=O.filter(x=>x.payment_status==='SUBMITTED').length,paid=O.filter(x=>x.payment_status==='PAID').length;settings=st.data||{};stats.innerHTML='<div class="stat"><div class="small">TOTAL ORDERS</div><div class="num">'+O.length+'</div></div><div class="stat"><div class="small">PAID SALES</div><div class="num">'+peso(sales)+'</div></div><div class="stat"><div class="small">PENDING PAYMENTS</div><div class="num">'+pending+'</div></div><div class="stat"><div class="small">PAID ORDERS</div><div class="num">'+paid+'</div></div>';
plist.innerHTML=(p.data||[]).map(x=>`<div class="row"><span>${x.image_url?'<img class="preview" style="width:60px;height:60px;vertical-align:middle;margin-right:10px" src="'+x.image_url+'">':''}<b>${x.name}</b><br><span class="small">${peso(x.amount)} • MOQ ${x.moq} • <span class="tag">${x.status}</span></span></span><div class="actions"><button class="btn alt" onclick="toggle('${x.id}','${x.status}')">${x.status==='AVAILABLE'?'SOLD OUT':'MAKE AVAILABLE'}</button><button class="btn alt" style="color:#b42318;border-color:#b42318" onclick="deleteProduct('${x.id}')">DELETE</button></div></div>`).join('')||empty('No Open for All products yet.');
payments.innerHTML=O.map(x=>`<div class="row"><span><b>${x.order_id}</b><br>${x.customer_name} • ${x.email}<br><b>${peso(x.total)}</b> • <span class="tag">${x.payment_status}</span><br>${x.payment_proof_url?'<a target="_blank" href="'+x.payment_proof_url+'">View payment proof</a>':'No payment proof'}</span><div class="actions"><button class="btn" onclick="stat('${x.order_id}','PAID')">APPROVE</button><button class="btn alt" onclick="stat('${x.order_id}','REJECTED')">REJECT</button><button class="btn alt" style="color:#b42318;border-color:#b42318" onclick="deleteOrder('${x.order_id}')">DELETE ORDER</button></div></div>`).join('')||empty('No payments yet.');
ways.innerHTML=(w.data||[]).map(x=>'<div class="row"><span><b>'+x.order_id+'</b><br><span class="tag">'+x.status+'</span><br>'+ (x.waybill_number||'No waybill yet')+'</span><button class="btn" onclick="wb(\''+x.id+'\')">EDIT WAYBILL</button></div>').join('')||empty('No Open for All waybills yet.');
pay.value=settings.payment_name||'';ins.value=settings.payment_instructions||'';lu.value=settings.luzon_fee??100;vi.value=settings.visayas_fee??150;mi.value=settings.mindanao_fee??180;la.value=settings.lalamove_fee??0;if(settings.payment_qr_url){qrprev.src=settings.payment_qr_url;qrprev.style.display='block'}}
async function upload(file,folder){if(!file)return null;let ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,''),path=folder+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext,r=await s.storage.from('ofa-assets').upload(path,file,{contentType:file.type,upsert:false});if(r.error)throw r.error;return s.storage.from('ofa-assets').getPublicUrl(path).data.publicUrl}
async function addP(){const pnEl=document.getElementById('pn'),paEl=document.getElementById('pa'),pmEl=document.getElementById('pm'),piEl=document.getElementById('pi'),pp=document.getElementById('pprev'),b=document.getElementById('addProductBtn'),statusEl=document.getElementById('saveStatus');statusEl.textContent='Starting save...';if(!pnEl.value.trim()||!paEl.value){statusEl.textContent='Please enter Product Name and Amount.';return alert('Please enter Product Name and Amount.');}b.disabled=true;b.textContent='SAVING...';statusEl.textContent='Saving product to database...';try{let r=await s.from('ofa_products').insert({name:pnEl.value.trim(),amount:+paEl.value,moq:+pmEl.value||1,status:'AVAILABLE'}).select().single();if(r.error)throw r.error;let saved=r.data;if(!saved||!saved.id)throw new Error('Product save returned no ID');let photoWarning='';if(piEl.files[0]){try{let url=await upload(piEl.files[0],'products');if(url){let u=await s.from('ofa_products').update({image_url:url}).eq('id',saved.id);if(u.error)throw u.error}}catch(e){console.error('Photo upload failed',e);photoWarning=' Product was saved, but the photo did not upload: '+(e.message||'unknown error')}}pnEl.value=paEl.value='';pmEl.value=1;piEl.value='';pp.style.display='none';statusEl.textContent='Product saved successfully.';alert('Product saved!'+photoWarning);await load()}catch(e){console.error(e);statusEl.textContent='ERROR: '+(e.message||JSON.stringify(e));alert('Could not add product: '+(e.message||JSON.stringify(e)))}finally{b.disabled=false;b.textContent='ADD PRODUCT'}}
async function toggle(id,st){let r=await s.from('ofa_products').update({status:st==='AVAILABLE'?'SOLD_OUT':'AVAILABLE'}).eq('id',id);if(r.error)alert(r.error.message);else load()}
async function deleteProduct(id){if(!confirm('Delete this Open for All product? This is for trial only. Products already used in an order cannot be deleted.'))return;let r=await s.from('ofa_products').delete().eq('id',id);if(r.error)alert('Could not delete product: '+r.error.message);else load()}
async function deleteOrder(orderId){if(!confirm('DELETE Open for All order '+orderId+'? This removes only this Open for All order, its items and its waybill. Group Buy orders are NOT touched.'))return;let r=await s.from('ofa_orders').delete().eq('order_id',orderId);if(r.error)alert('Could not delete order: '+r.error.message);else load()}
async function stat(id,v){let r=await s.from('ofa_orders').update({payment_status:v,updated_at:new Date().toISOString()}).eq('order_id',id);if(r.error)alert(r.error.message);else load()}
async function wb(id){let v=prompt('Waybill / tracking number');if(v===null)return;let r=await s.from('ofa_waybills').update({waybill_number:v,tracking_number:v,status:v?'WAYBILL READY':'WAITING FOR WAYBILL',updated_at:new Date().toISOString()}).eq('id',id);if(r.error)alert(r.error.message);else load()}
async function save(){const b=document.getElementById('saveSettingsBtn');b.disabled=true;b.textContent='SAVING...';try{let data={id:true,payment_name:pay.value.trim()||null,payment_instructions:ins.value.trim()||null,luzon_fee:+lu.value||0,visayas_fee:+vi.value||0,mindanao_fee:+mi.value||0,lalamove_fee:+la.value||0,updated_at:new Date().toISOString()};let r=await s.from('ofa_settings').upsert(data,{onConflict:'id'}).select().single();if(r.error)throw r.error;let photoWarning='';if(qrfile.files[0]){try{let url=await upload(qrfile.files[0],'qr');let u=await s.from('ofa_settings').update({payment_qr_url:url,updated_at:new Date().toISOString()}).eq('id',true);if(u.error)throw u.error}catch(e){console.error('QR upload failed',e);photoWarning=' Settings were saved, but the QR image did not upload: '+(e.message||'unknown error')}}alert('MOQ settings saved!'+photoWarning);await load()}catch(e){console.error(e);alert('Could not save settings: '+(e.message||JSON.stringify(e)))}finally{b.disabled=false;b.textContent='SAVE SETTINGS'}}
document.getElementById('addProductBtn').addEventListener('click',addP);document.getElementById('saveSettingsBtn').addEventListener('click',save);
document.getElementById('pi').addEventListener('change',()=>{let f=document.getElementById('pi').files[0];if(f){document.getElementById('pprev').src=URL.createObjectURL(f);document.getElementById('pprev').style.display='block'}});qrfile.addEventListener('change',()=>{let f=qrfile.files[0];if(f){qrprev.src=URL.createObjectURL(f);qrprev.style.display='block'}});
boot().catch(e=>document.body.innerHTML='<div class="w"><div class="card"><h2>Admin error</h2><p>'+e.message+'</p></div></div>')
</script></body></html>
