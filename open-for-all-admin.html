<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open for All Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><style>body{font-family:Arial;background:#fff8fb;margin:0}.w{max-width:1050px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #ecdde5;border-radius:18px;padding:17px;margin:13px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.f input,.f textarea{width:100%;box-sizing:border-box;padding:10px}.btn{background:#c32f8b;color:#fff;border:0;border-radius:10px;padding:10px;font-weight:800}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #eee}</style></head><body><div class="w"><h1>🌐 Open for All Admin</h1><p>Separate Orders • Payments • Waybills • Totals</p><div id="dash" class="card"></div><div class="card"><h2>Add Product</h2><div class="grid"><div class="f">Name<input id="pn"></div><div class="f">Amount<input id="pa" type="number"></div><div class="f">MOQ<input id="pm" type="number" value="1"></div><div class="f">Image URL<input id="pi"></div></div><button class="btn" onclick="addP()">ADD</button><div id="plist"></div></div><div class="card"><h2>Payments / Approval</h2><div id="payments"></div></div><div class="card"><h2>Waybills</h2><div id="ways"></div></div><div class="card"><h2>Separate QR & Shipping</h2><div class="grid"><div class="f">QR URL<input id="qr"></div><div class="f">Payment Name<input id="pay"></div><div class="f">Luzon<input id="lu" type="number"></div><div class="f">Visayas<input id="vi" type="number"></div><div class="f">Mindanao<input id="mi" type="number"></div></div><div class="f">Instructions<textarea id="ins"></textarea></div><button class="btn" onclick="save()">SAVE SETTINGS</button></div></div><script>
let s;const peso=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2});async function boot(){s=initSupabase();await requireAdmin();load()}async function load(){let [o,p,w,st]=await Promise.all([s.from('ofa_orders').select('*').order('created_at',{ascending:false}),s.from('ofa_products').select('*'),s.from('ofa_waybills').select('*'),s.from('ofa_settings').select('*').eq('id',true).single()]);let O=o.data||[],sales=O.reduce((a,x)=>a+(+x.total||0),0);dash.innerHTML='<h2>Total Orders: '+O.length+' • Total Sales: '+peso(sales)+'</h2><p>Pending '+O.filter(x=>x.payment_status==='SUBMITTED').length+' • Paid '+O.filter(x=>x.payment_status==='PAID').length+'</p>';plist.innerHTML=(p.data||[]).map(x=>'<div class="row"><span>'+x.name+' • '+peso(x.amount)+' • MOQ '+x.moq+' • '+x.status+'</span><button class="btn" onclick="toggle(\''+x.id+'\',\''+x.status+'\')">Toggle</button></div>').join('');payments.innerHTML=O.map(x=>'<div class="row"><span><b>'+x.order_id+'</b><br>'+x.customer_name+' • '+x.email+' • '+peso(x.total)+' • '+x.payment_status+'<br>'+(x.payment_proof_url?'<a target="_blank" href="'+x.payment_proof_url+'">View proof</a>':'')+'</span><span><button class="btn" onclick="stat(\''+x.order_id+'\',\'PAID\')">APPROVE</button> <button class="btn" onclick="stat(\''+x.order_id+'\',\'REJECTED\')">REJECT</button></span></div>').join('');ways.innerHTML=(w.data||[]).map(x=>'<div class="row"><span>'+x.order_id+' • '+x.status+' • '+(x.waybill_number||'No waybill')+'</span><button class="btn" onclick="wb(\''+x.id+'\')">EDIT WAYBILL</button></div>').join('');let a=st.data||{};qr.value=a.payment_qr_url||'';pay.value=a.payment_name||'';ins.value=a.payment_instructions||'';lu.value=a.luzon_fee||100;vi.value=a.visayas_fee||150;mi.value=a.mindanao_fee||180}async function addP(){let r=await s.from('ofa_products').insert({name:pn.value,amount:+pa.value,moq:+pm.value||1,image_url:pi.value||null});if(r.error)alert(r.error.message);else load()}async function toggle(id,st){await s.from('ofa_products').update({status:st==='AVAILABLE'?'SOLD_OUT':'AVAILABLE'}).eq('id',id);load()}async function stat(id,v){await s.from('ofa_orders').update({payment_status:v}).eq('order_id',id);load()}async function wb(id){let v=prompt('Waybill/tracking number');if(v!==null){await s.from('ofa_waybills').update({waybill_number:v,tracking_number:v,status:'WAYBILL READY'}).eq('id',id);load()}}async function save(){let r=await s.from('ofa_settings').update({payment_qr_url:qr.value||null,payment_name:pay.value||null,payment_instructions:ins.value||null,luzon_fee:+lu.value,visayas_fee:+vi.value,mindanao_fee:+mi.value,updated_at:new Date().toISOString()}).eq('id',true);alert(r.error?r.error.message:'Saved')}boot().catch(e=>document.body.innerHTML='<div class="w"><h2>Admin error</h2>'+e.message+'</div>')</script></body></html>
