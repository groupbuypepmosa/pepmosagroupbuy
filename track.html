<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PEPMOSA • Track</title><link rel="stylesheet" href="style.css"><style>
.trackCard{margin-top:16px}
.trackStatus{font-size:18px;font-weight:900;color:#9f245f}
.trackTimeline{display:flex;gap:7px;overflow:auto;padding:14px 0 6px}
.trackDot{min-width:132px;padding:10px 9px;border-radius:13px;background:linear-gradient(180deg,#faf5f8,#f0e8ee);border:1px solid #ead7e2;font-size:10px;font-weight:900;text-align:center;color:#6f6670}
.trackDot.current{background:linear-gradient(135deg,#ec4b9a,#b72a7a);color:#fff;border-color:#c92f84;box-shadow:0 8px 20px rgba(201,47,132,.22)}
.trackDot.done{background:#edf8f2;color:#23784e;border-color:#cce8d9}
.orderProducts{margin-top:12px;padding:12px 14px;border-radius:14px;background:linear-gradient(180deg,#fff8fc,#fff3f9);border:1px solid #f2d6e5}
.productLine{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed #eccbdd}
.productLine:last-child{border-bottom:0}
.manualNote{margin-top:12px;background:#fff8df!important;border:1px solid #f0dc8d;border-radius:12px}
.ordersAccordion{margin-top:12px;border:1px solid #f0d6e4;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#fff,#fff9fc);box-shadow:0 10px 28px rgba(158,47,104,.08)}
.orderDrop{border-bottom:1px solid #f2dce7}
.orderDrop:last-child{border-bottom:0}
.orderDrop summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px;font-weight:900;background:linear-gradient(90deg,#fff9fc,#fff);transition:.2s ease}
.orderDrop summary:hover{background:#fff2f8}
.orderDrop summary::-webkit-details-marker{display:none}
.orderDrop summary:after{content:'⌄';color:#c72d86;font-size:20px;font-weight:900}
.orderDrop[open] summary{background:linear-gradient(90deg,#fff0f7,#fff9fc);border-bottom:1px solid #f2dce7}
.orderDrop[open] summary:after{content:'⌃'}
.orderSummaryText{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#4b4650;letter-spacing:.01em;line-height:1.35}
.orderNumber{margin-left:auto;white-space:nowrap;font-size:12px;font-weight:900;color:#a12870;background:linear-gradient(135deg,#fff0f8,#ffe1ef);border:1px solid #efbdd7;border-radius:999px;padding:7px 10px;box-shadow:0 4px 12px rgba(185,43,117,.1)}
.orderDropBody{padding:0 16px 16px}
.orderDropBody .row{padding-top:12px}
@media(max-width:640px){.orderDrop summary{align-items:flex-start;flex-wrap:wrap}.orderSummaryText{white-space:normal;flex:1 1 100%}.orderNumber{margin-left:0}.trackStatus{font-size:15px}}
</style></head><body><header><a class="brand" href="index.html"><span class="logoMark">P</span>PEPMOSA</a><nav class="nav"><a href="index.html">HOME</a><a href="calculator.html">CALCULATOR</a><a href="protocols.html">PROTOCOLS</a><a href="track.html">TRACK</a><a href="coa.html">COA</a></nav></header><main class="wrap"><section class="hero"><div><div class="eyebrow">ORDER TRACKING</div><h1>Track Your Order</h1><p class="muted">Enter the email used with your order.</p></div></section><section class="card trackCard"><input id="email" class="input" placeholder="Email" type="email" onkeydown="if(event.key==='Enter')track()"><div class="actions"><button class="btn primary" onclick="track()">TRACK ORDER</button></div><div id="out"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script>initSupabase();const STATUSES=['ORDER RECEIVED','PAYMENT CONFIRMED','ORDER PROCESSING','IN TRANSIT TO THE PHILIPPINES','ARRIVED IN THE PHILIPPINES','RECEIVED AT WAREHOUSE','PACKING & LABELLING','HANDED OVER TO LOCAL COURIER','DELIVERED'];function $(id){return document.getElementById(id)}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function peso(v){return '₱'+Number(v||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2})}function itemsFor(o,all){if(Array.isArray(o.items))return o.items;if(Array.isArray(o.order_items))return o.order_items;if(Array.isArray(o.products))return o.products;const oid=o.id??o.order_id;return all.filter(i=>String(i.order_id??i.order?.id??'')===String(oid))}function itemLabel(i){const p=i.product||i.products||{};const name=i.product_name??p.name??i.name??'Product';const variant=i.variant_name??i.strength??i.variant??i.mg??i.product_variant?.name??i.product_variants?.name??i.variant_label??'';return [name,String(variant||'').replace(/\\s+/g,' ').trim()].filter(Boolean).join(' ')}function itemQty(i){return Number(i.quantity??i.qty??i.count??1)||1}function orderNote(o){return o.manual_note??o.note??o.notes??o.admin_note??o.late_order_note??''}async function track(){const e=$('email').value.trim().toLowerCase();if(!e)return;const out=$('out');out.innerHTML='<div class="notice">Loading your tracking details…</div>';try{const r=await sb.rpc('get_customer_tracking',{p_email:e});if(r.error)throw r.error;const data=r.data||{},orders=data.orders||[],shipments=data.shipments||[],allItems=data.order_items||data.items||[];if(!orders.length&&!shipments.length){out.innerHTML='<div class="notice">No orders found for this email.</div>';return}const shipmentHtml=shipments.map(s=>{const ci=STATUSES.indexOf(s.status);return '<div class="card"><div class="row"><div><div class="eyebrow">CONSOLIDATED SHIPMENT</div><b>'+esc(s.shipment_id)+'</b></div><div class="trackStatus">'+esc(s.status)+'</div></div>'+(s.tracking_number?'<div class="row"><span>Tracking</span><b>'+esc(s.tracking_number)+'</b></div>':'')+(s.waybill_number?'<div class="row"><span>Waybill</span><b>'+esc(s.waybill_number)+'</b></div>':'')+'<div class="trackTimeline">'+STATUSES.map((x,i)=>'<div class="trackDot '+(i===ci?'current':i<ci?'done':'')+'">'+esc(x)+'</div>').join('')+'</div>'+(s.notes?'<div class="notice">'+esc(s.notes)+'</div>':'')+'</div>'}).join('');const ordersHtml=orders.length?'<div class="card"><h2>Your Orders</h2><div class="ordersAccordion">'+orders.map((o,idx)=>{const items=itemsFor(o,allItems),note=orderNote(o);const label=items.length?items.map(i=>itemLabel(i).toUpperCase()+'  •  QTY '+itemQty(i)).join('   |   '):'VIEW ORDER DETAILS';return '<details class="orderDrop"><summary><span class="orderSummaryText">'+esc(label)+'</span><span class="orderNumber">ORDER# '+esc(o.order_id??o.id??'—')+'</span></summary><div class="orderDropBody"><div class="row"><span>'+(o.gb_number?'<small>GB '+esc(o.gb_number)+'</small>':'')+'</span><span><b>'+peso(o.total)+'</b><br><small>'+esc(o.payment_status)+'</small></span></div>'+(items.length?'<div class="orderProducts">'+items.map(i=>'<div class="productLine"><span>'+esc(itemLabel(i))+'</span><b>× '+itemQty(i)+'</b></div>').join('')+'</div>':'<div class="notice" style="margin-top:10px">Product details unavailable for this order.</div>')+(note?'<div class="notice manualNote"><b>NOTE:</b> '+esc(note)+'</div>':'')+'</div></details>'}).join('')+'</div></div>':'';out.innerHTML=shipmentHtml+ordersHtml}catch(err){console.error(err);out.innerHTML='<div class="notice error">Unable to load tracking. Please try again.</div>'}}</script></body></html>
