<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Budulan Hanggang Mamatay</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800&family=Parisienne&display=swap');
:root{--pink:#ec2d78;--hot:#d71961;--rose:#b51c55;--ink:#482033;--muted:#9b7081;--pale:#fff2f8;--line:#f3c8da;--green:#159653;--greenbg:#e6f8ed;--red:#d92d45;--redbg:#ffe9ed;--shadow:0 18px 50px rgba(188,55,108,.13)}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:'DM Sans',sans-serif;background:radial-gradient(circle at 10% 5%,#fff 0,#fff5fa 32%,#ffeef7 100%);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.page{max-width:1540px;margin:auto;padding:18px 18px 45px}
/* HERO */
.hero{position:relative;overflow:hidden;border:1px solid #f2bdd2;border-radius:34px;padding:26px 34px 24px;background:linear-gradient(110deg,#ffd4e6,#fff8fb 48%,#ffddec);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:20px}.hero:before,.hero:after{position:absolute;content:'✦  ♡  ✦';color:#ec72a3;opacity:.55;font-size:26px;letter-spacing:12px}.hero:before{left:26px;top:12px}.hero:after{right:24px;bottom:12px}.brand{position:relative;z-index:1}.brand h1{margin:0;color:#cf1d62;font-family:'Playfair Display',serif;font-size:clamp(35px,4.5vw,66px);line-height:.95;letter-spacing:1px;text-shadow:0 2px 0 #fff}.brand .script{margin:4px 0 0 72px;color:#d92770;font-family:'Parisienne',cursive;font-size:clamp(24px,3vw,39px)}.hero-note{font-size:12px;font-weight:700;color:#a25e79;margin:7px 0 0 75px}.hero-actions{position:relative;z-index:2;display:flex;gap:10px;flex-shrink:0}.hero-btn{border:1px solid #edb5cd;background:#fff8fb;color:#ad1d54;border-radius:18px;padding:12px 16px;font-weight:900;box-shadow:0 8px 20px rgba(187,44,100,.09)}.hero-btn.primary{background:linear-gradient(135deg,var(--pink),#f45a9a);color:#fff;border:0}
/* LAYOUT */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;margin-top:18px}.budols{display:flex;flex-direction:column;gap:16px}.budol{background:rgba(255,255,255,.95);border:1px solid #f0bfd4;border-radius:28px;padding:10px;box-shadow:var(--shadow);overflow:hidden}.budol-head{min-height:82px;border-radius:22px;background:linear-gradient(110deg,#ffcde2,#fff1f7 62%,#ffd7e8);border:1px solid #f5bfd5;display:flex;align-items:center;gap:12px;padding:10px 15px;position:relative;overflow:hidden}.budol-head:after{content:'♡  ✦  ♡';position:absolute;right:18px;top:8px;color:#ec77a6;font-size:17px;opacity:.55}.crown{font-size:30px}.budol-name{min-width:0;flex:1;border:0;outline:0;background:transparent;color:#c91b60;font-family:'Playfair Display',serif;font-size:28px;font-weight:900}.budol-name::placeholder{color:#c988a1}.open-pill{border:1px solid #efa9c6;background:#fff8fb;color:#d12467;border-radius:999px;padding:7px 11px;font-size:10px;font-weight:900;z-index:1}.head-total{background:#fff;border:1px solid #efc2d5;border-radius:999px;padding:9px 13px;font-size:11px;font-weight:900;color:#b51d55;white-space:nowrap;z-index:1}.head-delete{width:35px;height:35px;border:0;border-radius:11px;background:#fff1f6;color:#d32466;font-size:18px;font-weight:900;z-index:1}
/* ADD BAR */
.add-panel{padding:12px 7px 8px}.add-title{font-size:11px;font-weight:900;color:#9d1b4c;margin:0 0 8px 3px}.add-form{display:grid;grid-template-columns:1.1fr 1.3fr 120px 105px;gap:8px}.field{width:100%;border:1px solid #eac9d8;border-radius:12px;background:#fff;padding:11px 12px;color:#4f2939;outline:0}.field:focus{border-color:#ed5b98;box-shadow:0 0 0 3px rgba(236,45,120,.08)}.add-btn{border:0;border-radius:12px;background:linear-gradient(135deg,var(--pink),#f45496);color:#fff;font-weight:900;box-shadow:0 8px 17px rgba(236,45,120,.18)}.no-products{padding:9px 11px;border-radius:12px;background:#fff7fa;color:#ae7187;font-size:11px;border:1px dashed #e8afc7}
/* SUMMARY */
.summary{margin:5px 3px 4px;border:1px solid #f0c4d6;border-radius:21px;background:linear-gradient(180deg,#fff1f7,#fffafd);overflow:hidden}.summary-top{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-bottom:1px solid #f2d5e1}.summary-title{color:#a6194e;font-weight:900;font-size:13px;letter-spacing:.5px}.summary-sub{font-size:10px;color:#ae788c;font-weight:700}.summary-group{margin:10px;border:1px solid #efd0de;border-radius:17px;overflow:hidden;background:#fff;box-shadow:0 5px 14px rgba(178,47,96,.05)}.summary-product{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;background:linear-gradient(90deg,#ffdce9,#fff0f6);border-bottom:1px solid #f1cedd}.product-name-big{font-family:'Playfair Display',serif;color:#b91556;font-size:22px;font-weight:900}.product-price{font-size:10px;color:#b16d84;font-weight:800}.entry{display:grid;grid-template-columns:minmax(120px,1fr) 80px 125px 90px 64px;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid #f3e0e8}.entry:last-child{border-bottom:0}.who{font-weight:800;color:#513040}.qty{font-size:11px;color:#916276;font-weight:800;text-align:center}.amount{font-size:12px;font-weight:900;color:#9e1a4c;text-align:right;white-space:nowrap;padding-right:4px}.status{justify-self:end;width:76px;box-sizing:border-box;border-radius:999px;padding:7px 9px;border:1px solid;outline:0;font-size:9px;font-weight:900}.entry.unpaid{background:#fffafb;border-left:4px solid #ef4a5c}.entry.paid{background:#f5fff8;border-left:4px solid #2cb26b}.entry.unpaid .status{background:var(--redbg);border-color:#f0abb4;color:#c92b3e}.entry.paid .status{background:var(--greenbg);border-color:#a8dbba;color:#147c45}.entry.unpaid .who{color:#a92739}.entry.paid .who{color:#157d47}.entry-actions{display:flex;gap:5px;justify-content:flex-end}.edit-btn,.delete-btn{height:30px;border:0;border-radius:9px;padding:0 9px;font-size:9px;font-weight:900}.edit-btn{background:#fff0f6;color:#d22467}.delete-btn{background:#ffe7ee;color:#d92d45}.tiny{width:28px;height:28px;border:0;border-radius:9px;background:#fff0f6;color:#d22467;font-weight:900}.group-total{display:flex;justify-content:flex-end;gap:14px;padding:10px 14px;background:#fff8fb;border-top:1px dashed #e8b7cb;font-size:11px;font-weight:900;color:#a91c51}.empty{padding:18px;text-align:center;color:#b38a9b;font-size:11px}.new-budol{border:2px dashed #e2a2bd;background:#fffafd;color:#d22367;border-radius:18px;padding:15px;width:100%;font-weight:900;font-size:14px}.new-budol:hover{background:#fff0f7}
/* SIDEBAR */
.sidebar{position:sticky;top:16px}.settings{background:rgba(255,255,255,.97);border:1px solid #efbfd3;border-radius:27px;box-shadow:var(--shadow);overflow:hidden}.settings-head{padding:17px 18px;background:linear-gradient(105deg,#ffd0e3,#ffeaf3);display:flex;align-items:center;gap:10px}.gear{font-size:25px}.settings-head h2{margin:0;color:#a91850;font-size:19px}.settings-head p{margin:2px 0 0;color:#aa7186;font-size:10px;font-weight:700}.setting{padding:15px;border-bottom:1px solid #f2dce5}.label{font-size:10px;font-weight:900;color:#a21b4d;letter-spacing:.7px;margin-bottom:7px}.setting input{width:100%;border:1px solid #e7cad7;border-radius:11px;padding:10px 11px;outline:0}.setting input:focus{border-color:#ef5d9b;box-shadow:0 0 0 3px rgba(236,45,120,.08)}.setting .full{width:100%;margin-top:8px;border:0;border-radius:12px;padding:11px;background:linear-gradient(135deg,var(--pink),#f25397);color:#fff;font-weight:900}.prod-form{display:grid;grid-template-columns:1fr 90px;gap:7px}.prod-form .full{grid-column:1/-1}.products{padding:5px 14px 15px}.product-item{display:grid;grid-template-columns:1fr 65px 34px 34px;gap:5px;align-items:center;padding:9px 0;border-top:1px solid #f2dce5}.product-item input{width:100%;border:1px solid transparent;background:#fff9fb;border-radius:8px;padding:7px;font-size:11px;outline:0;color:#543242}.product-item input:focus{border-color:#eeb0c8;background:#fff}.product-item button{height:29px;border:0;border-radius:8px;background:#ffe4ee;color:#d32667;font-weight:900}.master-title{padding:13px 15px 7px;color:#a51c50;font-size:11px;font-weight:900}.master-list{display:flex;flex-direction:column;gap:7px;padding:0 14px 14px}.master-chip{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border:1px solid #f0d0dd;border-radius:11px;background:#fff8fb;font-size:11px;font-weight:800}.master-chip span:last-child{color:#b51b55}
.modal-backdrop{position:fixed;inset:0;background:rgba(83,24,50,.28);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:18px;z-index:9999}.modal-backdrop.show{display:flex}.edit-modal{width:min(480px,100%);background:#fffafd;border:1px solid #efbfd3;border-radius:26px;box-shadow:0 25px 80px rgba(108,26,63,.25);overflow:hidden}.edit-modal-head{padding:18px 20px;background:linear-gradient(110deg,#ffd0e3,#fff0f7);display:flex;justify-content:space-between;align-items:center}.edit-modal-head h3{margin:0;color:#a91850;font-family:'Playfair Display',serif;font-size:22px}.modal-close{border:0;background:#fff1f6;color:#d22467;width:34px;height:34px;border-radius:10px;font-size:18px;font-weight:900}.edit-body{padding:18px;display:grid;gap:11px}.edit-label{font-size:10px;font-weight:900;color:#a21b4d}.edit-body .field{margin-top:5px}.edit-actions{display:flex;gap:8px;padding:0 18px 18px}.edit-actions button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:900}.save-edit{background:linear-gradient(135deg,var(--pink),#f45496);color:#fff}.cancel-edit{background:#ffe9f2;color:#b51d55}.delete-edit{background:#ffe1e8;color:#d92d45}
@media(max-width:1050px){.layout{grid-template-columns:1fr}.sidebar{position:static}.hero{align-items:flex-start}.hero-actions{margin-top:2px}}@media(max-width:760px){.page{padding:10px}.hero{padding:22px 18px;display:block}.brand .script,.hero-note{margin-left:0}.brand h1{font-size:36px}.hero-actions{margin-top:15px}.layout{gap:12px}.budol-head{padding:8px 10px}.budol-name{font-size:23px}.head-total{font-size:9px;padding:8px}.add-form{grid-template-columns:1fr 1fr}.add-form .add-btn{min-height:43px}.summary-product{padding:11px}.product-name-big{font-size:20px}.entry{grid-template-columns:minmax(100px,1fr) 68px 105px 74px}.status{width:74px}.entry-actions{grid-column:1/-1;justify-content:flex-end}.status{font-size:8px}.group-total{font-size:10px}}
</style></head><div class="page"><header class="hero"><div class="brand"><h1>🎀 BUDULAN</h1><div class="script">Hanggang Mamatay</div><div class="hero-note">Outside GB Orders · More Orders · More Budols ♡</div></div><div class="hero-actions"><button class="hero-btn" id="scrollSettings">⚙ SETTINGS</button><button class="hero-btn primary" id="saveNow">● LIVE</button></div></header><div class="layout"><main><div id="budols" class="budols"></div><button class="new-budol" id="newBudol">＋ ADD NEW BUDOL</button></main><aside class="sidebar" id="settings"><div class="settings"><div class="settings-head"><div class="gear">⚙</div><div><h2>SETTINGS</h2><p>Manage Products & Prices</p></div></div><div class="setting"><div class="label">BUDOL NAME</div><input id="budolName" placeholder="Enter Budol Name"><button class="full" id="createBudol">＋ CREATE BUDOL</button></div><div class="setting"><div class="label">PRODUCTS & PRICES</div><div class="prod-form"><input id="productName" placeholder="Product name"><input id="productPrice" type="number" min="0" placeholder="Price/vial"><button class="full" id="addProduct">＋ ADD PRODUCT</button></div></div><div class="master-title">MASTER PRODUCT LIST</div><div style="padding:0 14px 10px"><select id="assignBudol" class="field" style="padding:9px 10px"><option value="">Select Budol to add product</option></select></div><div class="products" id="products"></div></div></aside></div></div><div class="modal-backdrop" id="editModal"><div class="edit-modal"><div class="edit-modal-head"><h3>✦ EDIT ORDER</h3><button class="modal-close" id="closeEdit">×</button></div><div class="edit-body"><label class="edit-label">NAME<input id="editName" class="field" placeholder="Customer name"></label><label class="edit-label">PRODUCT<select id="editProduct" class="field"></select></label><label class="edit-label">VIALS<input id="editQty" class="field" type="number" min="1" placeholder="Vials"></label></div><div class="edit-actions"><button class="delete-edit" id="deleteEdit">DELETE</button><button class="cancel-edit" id="cancelEdit">CANCEL</button><button class="save-edit" id="saveEdit">SAVE CHANGES</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://pnetzdggtlbuhuxdzzak.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_f-FUnzjqozjjeB-KIIml-A_i9zFvQ2U';
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{realtime:{params:{eventsPerSecond:10}}});
const $=id=>document.getElementById(id);
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>Number(v||0).toLocaleString('en-PH',{minimumFractionDigits:0,maximumFractionDigits:2});
let state={products:[],budols:[],assignments:[],orders:[]};
let editing=null;
let loading=false;
let refreshTimer=null;

async function loadAll(){
  loading=true;
  try{
    const [p,b,a,o]=await Promise.all([
      client.from('budulan_products').select('*').order('created_at'),
      client.from('budulan_budols').select('*').order('sort_order').order('created_at'),
      client.from('budulan_budol_products').select('*'),
      client.from('budulan_orders').select('*').order('created_at')
    ]);
    const err=[p,b,a,o].find(x=>x.error)?.error;
    if(err) throw err;
    state.products=p.data||[]; state.budols=b.data||[]; state.assignments=a.data||[]; state.orders=o.data||[];
    render();
    setLive('LIVE');
  }catch(e){console.error(e);setLive('RECONNECTING');}
  finally{loading=false;}
}
function setLive(t){const b=$('saveNow'); if(b){b.textContent=t==='LIVE'?'● LIVE':'↻ '+t; b.classList.toggle('primary',t==='LIVE');}}
function product(id){return state.products.find(p=>p.id===id)}
function budol(id){return state.budols.find(b=>b.id===id)}
function productsForBudol(bid){const ids=new Set(state.assignments.filter(a=>a.budol_id===bid).map(a=>a.product_id));return state.products.filter(p=>ids.has(p.id))}
function ordersForBudol(bid){return state.orders.filter(o=>o.budol_id===bid)}
function render(){renderBudols();renderProducts()}
function renderBudols(){
 const root=$('budols');root.innerHTML='';
 if(!state.budols.length){root.innerHTML='<div class="empty">No Budol yet. Create your first one from Settings. 🎀</div>';return}
 state.budols.forEach(b=>renderBudol(root,b));
}
function renderBudol(root,b){
 const sec=document.createElement('section');sec.className='budol';sec.dataset.id=b.id;
 const rows=ordersForBudol(b.id); const tv=rows.reduce((s,r)=>s+Number(r.qty||0),0);
 sec.innerHTML=`<div class="budol-head"><span class="crown">👑</span><input class="budol-name" placeholder="Budol Name" value="${esc(b.name)}"><span class="open-pill">• OPEN</span><span class="head-total">TOTAL: ${tv} VIALS</span><button class="head-delete" title="Delete Budol">×</button></div><div class="add-panel"><div class="add-title">ADD ORDER TO THIS BUDOL</div><div class="add-form"><input class="field add-name-input" placeholder="Customer name"><select class="field add-product"><option value="">Select product</option></select><input class="field add-qty" type="number" min="1" placeholder="Vials"><button class="add-btn">＋ ADD</button></div><div class="no-products" style="display:none">Add a product to this Budol first using Settings → Products & Prices.</div></div><div class="summary"><div class="summary-top"><span class="summary-title">💗 BUDOL SUMMARY</span><span class="summary-sub">LIVE • Click Edit to change an order</span></div><div class="summary-body"></div></div>`;
 root.appendChild(sec);
 const name=sec.querySelector('.budol-name'); name.addEventListener('change',async()=>{const v=name.value.trim(); if(v!==b.name){await client.from('budulan_budols').update({name:v,updated_at:new Date().toISOString()}).eq('id',b.id)}});
 sec.querySelector('.head-delete').onclick=async()=>{if(confirm('Delete this Budol and its orders?')){await client.from('budulan_budols').delete().eq('id',b.id);await loadAll()}};
 const sel=sec.querySelector('.add-product'); refreshAddProducts(sel,b.id);
 const note=sec.querySelector('.no-products'); note.style.display=productsForBudol(b.id).length?'none':'block';
 sec.querySelector('.add-btn').onclick=()=>addOrder(sec,b);
 sec.querySelector('.add-qty').addEventListener('keydown',e=>{if(e.key==='Enter')addOrder(sec,b)});
 renderSummary(sec,b);
}
function refreshAddProducts(sel,bid,keep=''){sel.innerHTML='<option value="">Select product</option>';productsForBudol(bid).forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name;sel.appendChild(o)});if([...sel.options].some(o=>o.value===keep))sel.value=keep}
async function addOrder(sec,b){
 const n=sec.querySelector('.add-name-input'),p=sec.querySelector('.add-product'),q=sec.querySelector('.add-qty');const name=n.value.trim(),pid=p.value,qty=Number(q.value);
 if(!name||!pid||!(qty>0)){[n,p,q].forEach(x=>{if(!x.value)x.focus()});return}
 const {error}=await client.from('budulan_orders').insert({id:uid(),budol_id:b.id,product_id:pid,customer_name:name,qty,remarks:'UNPAID'});if(error){alert(error.message);return}
 n.value='';p.value='';q.value='';n.focus();
}
function renderSummary(sec,b){
 const body=sec.querySelector('.summary-body');body.innerHTML='';const rows=ordersForBudol(b.id);const groups={};rows.filter(r=>r.customer_name&&r.product_id&&Number(r.qty)>0).forEach(r=>(groups[r.product_id]??=[]).push(r));const ids=Object.keys(groups);
 if(!ids.length){body.innerHTML='<div class="empty">No orders yet — add a name, product and vials above. 💕</div>';return}
 ids.forEach(pid=>{const p=product(pid);if(!p)return;const g=document.createElement('div');g.className='summary-group';const totalV=groups[pid].reduce((a,r)=>a+Number(r.qty||0),0);const totalAmt=groups[pid].reduce((a,r)=>a+Number(p.price||0)*Number(r.qty||0),0);
 g.innerHTML=`<div class="summary-product"><div><div class="product-name-big">${esc(p.name)}</div><div class="product-price">₱${money(p.price)} / vial</div></div><div class="head-total">TOTAL: ${totalV} VIALS</div></div>`;
 groups[pid].forEach(r=>{const e=document.createElement('div');e.className='entry '+(r.remarks==='PAID'?'paid':'unpaid');const total=Number(p.price||0)*Number(r.qty||0);e.innerHTML=`<span class="who">${esc(r.customer_name)}</span><span class="qty">${Number(r.qty)} VIALS</span><span class="amount">₱${money(total)}</span><span class="entry-actions"><select class="status"><option value="UNPAID">UNPAID</option><option value="PAID">PAID</option></select></span><span class="entry-actions"><button class="edit-btn">EDIT</button><button class="delete-btn">×</button></span>`;
 const st=e.querySelector('.status');st.value=r.remarks;st.onchange=async()=>{await client.from('budulan_orders').update({remarks:st.value,updated_at:new Date().toISOString()}).eq('id',r.id)};
 e.querySelector('.edit-btn').onclick=()=>openEdit(r);
 e.querySelector('.delete-btn').onclick=async()=>{if(confirm('Delete '+r.customer_name+' order?'))await client.from('budulan_orders').delete().eq('id',r.id)};
 g.appendChild(e)});
 const gt=document.createElement('div');gt.className='group-total';gt.innerHTML=`<span>PRODUCT TOTAL</span><span>${totalV} VIALS</span><span>₱${money(totalAmt)}</span>`;g.appendChild(gt);body.appendChild(g);
 });
}
function openEdit(r){editing=r;$('editName').value=r.customer_name;$('editQty').value=r.qty;const sel=$('editProduct');sel.innerHTML='';productsForBudol(r.budol_id).forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name;sel.appendChild(o)});sel.value=r.product_id;$('editModal').classList.add('show');setTimeout(()=>$('editName').focus(),30)}
function closeEdit(){editing=null;$('editModal').classList.remove('show')}
async function saveEdit(){if(!editing)return;const name=$('editName').value.trim(),pid=$('editProduct').value,q=Number($('editQty').value);if(!name||!pid||!(q>0))return;const {error}=await client.from('budulan_orders').update({customer_name:name,product_id:pid,qty:q,updated_at:new Date().toISOString()}).eq('id',editing.id);if(error){alert(error.message);return}closeEdit()}
$('closeEdit').onclick=closeEdit;$('cancelEdit').onclick=closeEdit;$('saveEdit').onclick=saveEdit;$('deleteEdit').onclick=async()=>{if(!editing)return;if(confirm('Delete '+editing.customer_name+' order?')){await client.from('budulan_orders').delete().eq('id',editing.id);closeEdit()}};$('editModal').addEventListener('click',e=>{if(e.target.id==='editModal')closeEdit()});
function renderProducts(){
 const box=$('products');box.innerHTML='';const ab=$('assignBudol');if(ab){const keep=ab.value;ab.innerHTML='<option value="">Select Budol to add product</option>';state.budols.forEach(b=>{const o=document.createElement('option');o.value=b.id;o.textContent=b.name||'Unnamed Budol';ab.appendChild(o)});if(state.budols.some(b=>b.id===keep))ab.value=keep}
 if(!state.products.length){box.innerHTML='<div class="empty">No products yet.</div>';return}
 state.products.forEach(p=>{const row=document.createElement('div');row.className='product-item';row.innerHTML=`<input class="pn"><input class="pp" type="number" min="0"><button class="assign-product" title="Add this product to selected Budol">＋</button><button class="delete-product">×</button>`;const n=row.querySelector('.pn'),pr=row.querySelector('.pp');n.value=p.name;pr.value=p.price;
 n.addEventListener('change',async()=>{await client.from('budulan_products').update({name:n.value.trim(),updated_at:new Date().toISOString()}).eq('id',p.id)});
 pr.addEventListener('change',async()=>{await client.from('budulan_products').update({price:Number(pr.value)||0,updated_at:new Date().toISOString()}).eq('id',p.id)});
 row.querySelector('.assign-product').onclick=async()=>{const bid=$('assignBudol')?.value;if(!bid){alert('Select a Budol first.');$('assignBudol')?.focus();return}const {error}=await client.from('budulan_budol_products').upsert({budol_id:bid,product_id:p.id});if(error)alert(error.message)};
 row.querySelector('.delete-product').onclick=async()=>{if(confirm('Delete '+p.name+' from the master list? This only works if no orders use it.')){const {error}=await client.from('budulan_products').delete().eq('id',p.id);if(error)alert('Cannot delete this product while it is assigned or ordered. Remove it from those Budols first.')}};
 box.appendChild(row)})
}
$('createBudol').onclick=async()=>{const n=$('budolName').value.trim();if(!n)return;const sort=(state.budols.length?Math.max(...state.budols.map(b=>Number(b.sort_order)||0))+1:0);const {error}=await client.from('budulan_budols').insert({id:uid(),name:n,sort_order:sort});if(error){alert(error.message);return}$('budolName').value=''};
$('newBudol').onclick=async()=>{const sort=(state.budols.length?Math.max(...state.budols.map(b=>Number(b.sort_order)||0))+1:0);await client.from('budulan_budols').insert({id:uid(),name:'',sort_order:sort})};
$('addProduct').onclick=async()=>{const n=$('productName').value.trim(),pr=Number($('productPrice').value);if(!n)return;const {error}=await client.from('budulan_products').insert({id:uid(),name:n,price:pr||0});if(error){alert(error.message);return}$('productName').value='';$('productPrice').value=''};
$('scrollSettings').onclick=()=>document.getElementById('settings').scrollIntoView({behavior:'smooth'});
$('saveNow').onclick=()=>{loadAll()};

client.channel('budulan-live-sync')
 .on('postgres_changes',{event:'*',schema:'public',table:'budulan_budols'},()=>scheduleRefresh())
 .on('postgres_changes',{event:'*',schema:'public',table:'budulan_products'},()=>scheduleRefresh())
 .on('postgres_changes',{event:'*',schema:'public',table:'budulan_budol_products'},()=>scheduleRefresh())
 .on('postgres_changes',{event:'*',schema:'public',table:'budulan_orders'},()=>scheduleRefresh())
 .subscribe(status=>{if(status==='SUBSCRIBED')setLive('LIVE');else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')setLive('RECONNECTING')});
function scheduleRefresh(){clearTimeout(refreshTimer);refreshTimer=setTimeout(loadAll,120)}
loadAll();
