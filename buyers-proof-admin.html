<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PEPMOSA • Manage Buyers Proof</title><link rel="stylesheet" href="style.css"><style>body{background:#fff9fc}.wrap{width:min(900px,94%);margin:28px auto}.card{background:#fff;border:1px solid #ead9e5;border-radius:20px;padding:22px;margin-bottom:18px}.preview{max-width:100%;max-height:360px;border-radius:14px;display:none;margin-top:14px}.row{display:flex;gap:10px;flex-wrap:wrap}.item{display:flex;gap:14px;padding:12px;border-bottom:1px solid #eee;align-items:center}.item img{width:80px;height:80px;object-fit:cover;border-radius:10px}.status{font-size:12px;padding:5px 8px;border-radius:8px;background:#f6e5ef}.btn{padding:10px 14px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:#d72b91;color:#fff}.danger{background:#eee}.field{margin:12px 0}.field input,.field textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px}</style></head><body><header><a class="brand" href="index.html"><span class="logoMark">P</span>PEPMOSA</a></header><main class="wrap"><div class="card"><div class="eyebrow">ADMIN ONLY</div><h1>♥ Manage Buyers' Proof</h1><p class="muted">Upload the privacy-protected version only. Preview it first, then publish.</p><div id="msg"></div><div class="field"><label>Proof Image</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp"></div><img id="preview" class="preview"><div class="field"><label>Caption (optional)</label><textarea id="caption" placeholder="e.g. Repeat buyer • Successfully received"></textarea></div><div class="row"><button class="btn primary" id="upload">UPLOAD & PUBLISH</button></div></div><div class="card"><h2>Published / Uploaded Proofs</h2><div id="list">Loading...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script>const sb=initSupabase(),msg=document.getElementById('msg'),file=document.getElementById('file'),preview=document.getElementById('preview');let admin=false;function say(t,e=false){msg.textContent=t;msg.style.color=e?'#c22':'#378'}async function boot(){try{await requireAdmin();admin=true;load()}catch(e){say(e.message,true)}}file.onchange=()=>{const f=file.files[0];if(!f)return;preview.src=URL.createObjectURL(f);preview.style.display='block'}document.getElementById('upload').onclick=async()=>{if(!admin)return;const f=file.files[0];if(!f)return say('Please choose an image.',true);if(f.size>10*1024*1024)return say('Maximum file size is 10MB.',true);say('Uploading...');const path='published/'+Date.now()+'-'+crypto.randomUUID()+'.'+(f.name.split('.').pop()||'jpg');const up=await sb.storage.from('buyer-proofs').upload(path,f,{contentType:f.type});if(up.error)return say(up.error.message,true);const ins=await sb.from('buyer_proofs').insert({image_path:path,caption:document.getElementById('caption').value.trim()||null,is_published:true});if(ins.error){await sb.storage.from('buyer-proofs').remove([path]);return say(ins.error.message,true)}say('Published successfully!');file.value='';preview.style.display='none';document.getElementById('caption').value='';load()}async function load(){const {data,error}=await sb.from('buyer_proofs').select('*').order('created_at',{ascending:false});if(error){document.getElementById('list').textContent=error.message;return}const box=document.getElementById('list');if(!data.length){box.textContent='No proofs yet.';return}box.innerHTML='';for(const p of data){const {data:u}=await sb.storage.from('buyer-proofs').createSignedUrl(p.image_path,3600);const d=document.createElement('div');d.className='item';d.innerHTML='<img src="'+(u?.signedUrl||'')+'"><div style="flex:1"><b>'+((p.caption)||'Buyers proof')+'</b><br><span class="status">'+(p.is_published?'PUBLISHED':'DRAFT')+'</span></div><button class="btn danger">DELETE</button>';d.querySelector('button').onclick=async()=>{if(!confirm('Delete this proof?'))return;await sb.storage.from('buyer-proofs').remove([p.image_path]);await sb.from('buyer_proofs').delete().eq('id',p.id);load()};box.appendChild(d)}}boot()</script></body></html>
