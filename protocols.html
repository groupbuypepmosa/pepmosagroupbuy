<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PEPMOSA • Protocols</title><link rel="stylesheet" href="style.css"><style>.docCard{background:#fff;border:1px solid #f0d7e4;border-radius:18px;padding:18px;margin:12px 0;display:flex;justify-content:space-between;gap:14px;align-items:center}.docCard h3{margin:0 0 4px}.docCard p{margin:0}.docBtn{padding:10px 14px;border-radius:12px;background:#d52b87;color:#fff;font-weight:800}@media(max-width:600px){.docCard{align-items:flex-start;flex-direction:column}}</style></head><body><header><a class="brand" href="index.html"><span class="logoMark">P</span>PEPMOSA</a><nav class="nav"><a href="index.html">HOME</a><a href="calculator.html">CALCULATOR</a><a href="protocols.html">PROTOCOLS</a><a href="track.html">TRACK</a><a href="coa.html">COA</a></nav></header><main class="wrap"><section class="hero"><div><div class="eyebrow">REFERENCE LIBRARY</div><h1>Protocols</h1><p class="muted">Browse available documents uploaded by PEPMOSA.</p></div></section><section id="documents"><div class="empty">Loading documents…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase.js"></script><script>initSupabase();const TYPE='PROTOCOL';async function load(){const box=document.getElementById('documents');const{data,error}=await sb.from('library_documents').select('*').eq('document_type',TYPE).order('created_at',{ascending:false});if(error){box.innerHTML='<div class="notice error">'+esc(error.message)+'</div>';return;}if(!data||!data.length){box.innerHTML='<div class="empty">No protocols uploaded yet.</div>';return;}box.innerHTML=data.map(d=>'<article class="docCard"><div><h3>'+esc(d.title)+'</h3><p class="muted">'+esc(d.product_name||d.file_name||'Document')+'</p></div><button class="docBtn" data-path="'+esc(d.file_path)+'">OPEN</button></article>').join('');box.querySelectorAll('.docBtn').forEach(b=>b.onclick=async()=>{const{data,error}=await sb.storage.from('library-documents').createSignedUrl(b.dataset.path,600);if(error){alert(error.message);return;}window.open(data.signedUrl,'_blank');});}load();</script></body></html>
