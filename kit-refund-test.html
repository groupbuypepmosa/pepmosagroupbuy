<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>PEPMOSA Kit Refund Test</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff7fb;color:#382c35}.wrap{max-width:900px;margin:auto;padding:25px 14px}.head{display:flex;gap:12px;align-items:center}.head img{width:55px;height:55px;object-fit:contain}.badge{background:#fff0f6;color:#bd2d86;border-radius:99px;padding:7px 10px;font-weight:800;font-size:11px}.note,.card,.stat{background:#fff;border:1px solid #eddee6;border-radius:20px;padding:17px;box-shadow:0 10px 28px #7a315515;margin-top:15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat b{display:block;font-size:28px;margin-top:8px}.top,.row{display:flex;justify-content:space-between;gap:15px}.row{padding:10px 0;border-bottom:1px solid #f2e9ee}.tag{padding:8px 10px;border-radius:99px;font-size:11px;font-weight:900;background:#fff0f1;color:#b52c43}.ok{background:#edf9f2;color:#287852}.muted{color:#857780;font-size:13px}.total{font-size:20px;font-weight:900;color:#bd2d86;padding-top:12px}button{border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:#c32f8b;color:#fff}.secondary{background:#f4edf1;color:#70465e}.actions{display:flex;gap:8px;margin-top:14px}.modal{display:none;position:fixed;inset:0;background:#321b2c88;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.box{width:min(480px,100%);background:#fff;border-radius:24px;padding:20px}input{width:100%;padding:12px;border:1px solid #e6dce1;border-radius:11px;margin:10px 0}@media(max-width:600px){.grid{grid-template-columns:1fr}.top{flex-direction:column}}
</style></head><body><main class="wrap"><div class="head"><img src="pepmosa-no-name.png"><div><h1>Kit Refund Center</h1><span class="badge">TEST ONLY • SAFE PROTOTYPE</span></div></div><div class="note">🧪 This page is only for testing the workflow. It does not change any live order, payment, waybill, or database record.</div><div class="grid"><div class="stat">Incomplete Kits<b id="a">2</b></div><div class="stat">Refund Pending<b id="b">2</b></div><div class="stat">Refunded<b id="c">0</b></div></div><div id="list"></div></main><div class="modal" id="m"><div class="box"><h2>Confirm Refund</h2><p class="muted" id="info"></p><input id="ref" placeholder="GCash / Bank reference (optional)"><div class="actions"><button class="secondary" onclick="closeM()">Cancel</button><button class="primary" onclick="confirmRefund()">Mark Refunded</button></div></div></div><script>
const data=[{id:1,name:'Sample Customer A',email:'customer@example.com',product:'Tirzepatide 30mg',qty:1,ordered:7,target:10,price:949,fee:200,status:'PENDING'},{id:2,name:'Sample Customer B',email:'sample2@example.com',product:'Lipo C + B12',qty:2,ordered:8,target:10,price:600,fee:0,status:'PENDING'}];let chosen=null;const peso=n=>'₱'+n.toLocaleString('en-PH',{minimumFractionDigits:2});
function render(){a.textContent=data.filter(x=>x.status!=='REFUNDED').length;b.textContent=data.filter(x=>x.status==='PENDING').length;c.textContent=data.filter(x=>x.status==='REFUNDED').length;list.innerHTML=data.map(x=>{let total=x.qty*x.price+x.fee;return '<section class="card"><div class="top"><div><span class="tag">⚠ KIT INCOMPLETE</span><h2>'+x.product+'</h2><div class="muted">'+x.name+' • '+x.email+'</div></div><span class="tag '+(x.status==='REFUNDED'?'ok':'')+'">'+(x.status==='REFUNDED'?'✓ REFUNDED':'⏳ REFUND PENDING')+'</span></div><div class="row"><span>Kit progress</span><b>'+x.ordered+'/'+x.target+' • '+(x.target-x.ordered)+' short</b></div><div class="row"><span>Product refund</span><b>'+peso(x.qty*x.price)+'</b></div><div class="row"><span>Admin fee refund</span><b>'+peso(x.fee)+'</b></div><div class="total">Total Refund: '+peso(total)+'</div><div class="actions">'+(x.status==='PENDING'?'<button class="primary" onclick="openM('+x.id+')">Mark as Refunded</button>':'<button class="secondary">Refund complete</button>')+'</div></section>'}).join('')}
function openM(id){chosen=data.find(x=>x.id===id);info.textContent=chosen.name+' • Total: '+peso(chosen.qty*chosen.price+chosen.fee);m.classList.add('show')}function closeM(){m.classList.remove('show')}function confirmRefund(){chosen.status='REFUNDED';chosen.ref=ref.value||'Manual refund';closeM();render()}render();
</script></body></html>
